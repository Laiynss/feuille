<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Feuille</title>
<style>
/* La feuille, sa marge où les outils sont posés, et la pile de dessins. Tout ce qu'on voit est tracé avec les outils de l'app. */
:root{
  --papier:#f4f3ef;
  --fond:#6d6e72;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--fond);overflow:hidden;overscroll-behavior:none}
body{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
#dessin{position:fixed;inset:0;background:var(--papier)}
#dessin canvas{position:absolute;top:0;touch-action:none;background:var(--papier)}
#feuille{left:0;width:100%;height:100%}
#marge{right:0;width:84px;height:100%}
#pile{position:fixed;inset:0;background:var(--fond)}
#fond{position:absolute;inset:0;width:100%;height:100%}
#ciel,#ciel2,#affiche{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1.2s ease}
#ciel,#ciel2{opacity:0}
#ciel.pret,#ciel2.pret{opacity:1}
#affiche.cache-doux,#ciel.cache-doux{opacity:0}
#cartes{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#cartes::-webkit-scrollbar{display:none}

#pile{--encre:#f3f1ea;--halo:rgba(0,0,0,.6);--brume:rgba(4,4,8,.62);--accent:#f2dd3a;--ox:0;--oy:1}
#pile.clair{--encre:#141418;--halo:rgba(255,255,255,.55);--brume:rgba(250,250,252,.5)}
#decor{position:absolute;inset:-28px;will-change:transform}
#voile{position:absolute;inset:0;pointer-events:none;transition:background 1s;
  background:radial-gradient(ellipse 120% 95% at 55% 48%,rgba(0,0,0,0) 52%,rgba(0,0,0,.5) 100%),
             linear-gradient(to bottom,var(--brume) 0,rgba(0,0,0,0) 300px),
             linear-gradient(to top,rgba(0,0,0,.35) 0,rgba(0,0,0,0) 180px)}
#grain{position:absolute;inset:-60%;pointer-events:none;opacity:.075;animation:grain 1s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-7%,4%)}40%{transform:translate(5%,-6%)}60%{transform:translate(-4%,-3%)}80%{transform:translate(6%,5%)}100%{transform:translate(0,0)}}
.contenu{will-change:transform;transition:opacity .4s}
#pile.choix .contenu{opacity:0}
.tete{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;padding:38px max(44px,4.6vw) 0;color:var(--encre);transition:color .8s}
.tete .titre{margin:0;font:800 88px/.9 "Mincho",serif;letter-spacing:-1.5px;text-shadow:0 2px 30px var(--halo)}
.tete .compte{font:500 19px/1.3 "Mincho",serif;margin:16px 0 0 5px;opacity:.8;letter-spacing:.4px;text-shadow:0 1px 12px var(--halo)}
.carnets{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 38px;margin:30px 0 0 4px}
.onglet{position:relative;font:500 25px "Mincho",serif;color:var(--encre);opacity:.5;background:none;border:0;padding:2px 1px 10px;cursor:pointer;text-shadow:0 1px 12px var(--halo);transition:opacity .3s}
.onglet.actif{opacity:1;font-weight:800}
.onglet.ajout{opacity:.62;font-size:22px}
#pile.clair .lieu .kanji{text-shadow:3px 3px 0 rgba(18,18,22,.92)}
#pile.clair .souligne{filter:drop-shadow(1.5px 1.5px 0 rgba(18,18,22,.85))}
.souligne{position:absolute;left:0;bottom:-3px;pointer-events:none;overflow:visible}
.souligne path{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round}
.saisie-onglet{font:500 25px "Mincho",serif;color:var(--encre);background:transparent;border:0;border-bottom:2px solid var(--accent);outline:0;width:9em;padding:2px 1px 8px}
.saisie-onglet::placeholder{color:var(--encre);opacity:.4}
.lieu{display:flex;align-items:flex-start;gap:10px;background:none;border:0;padding:0;margin-top:4px;cursor:pointer;color:var(--encre);flex:none;-webkit-tap-highlight-color:transparent}
.lieu .kanji{writing-mode:vertical-rl;font:800 50px/1 "Mincho",serif;letter-spacing:8px;color:var(--accent);text-shadow:0 2px 22px var(--halo);transition:color .8s}
.lieu .nom{writing-mode:vertical-rl;font:500 15px "Mincho",serif;letter-spacing:4px;opacity:.78;padding-top:6px;text-shadow:0 1px 10px var(--halo)}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(240px,40vw),1fr));gap:70px max(42px,3.8vw);padding:48px max(44px,4.6vw) 120px}
.tuile{position:relative}
.tete.arrive{animation:monte .9s cubic-bezier(.2,.75,.25,1) both}
.tuile.arrive{animation:pose .75s cubic-bezier(.18,.8,.25,1) both}
@keyframes monte{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes pose{0%{opacity:0;transform:translate(-14px,46px) rotate(5deg) scale(.94)}60%{opacity:1}100%{opacity:1;transform:none}}
.carte{--a:0deg;position:relative;width:100%;isolation:isolate;background:var(--papier);transform-origin:50% 60%;transform:rotate(var(--a));
  transition:transform .35s cubic-bezier(.2,.75,.25,1),box-shadow .35s;
  box-shadow:calc(var(--ox) * 1px) calc(var(--oy) * 1px + .5px) 1.5px rgba(0,0,0,.4),
             calc(var(--ox) * 6px) calc(var(--oy) * 6px + 4px) 12px rgba(0,0,0,.32),
             calc(var(--ox) * 22px) calc(var(--oy) * 22px + 12px) 44px rgba(0,0,0,.38)}
.carte.presse{transform:rotate(var(--a)) scale(.972);transition-duration:.12s;
  box-shadow:calc(var(--ox) * 1px) calc(var(--oy) * 1px + .5px) 1px rgba(0,0,0,.45),calc(var(--ox) * 3px) calc(var(--oy) * 3px + 2px) 6px rgba(0,0,0,.3)}
.carte.levee{transform:rotate(calc(var(--a) * .3)) translateY(-6px) scale(1.05);
  box-shadow:calc(var(--ox) * 2px) calc(var(--oy) * 2px + 2px) 3px rgba(0,0,0,.3),calc(var(--ox) * 14px) calc(var(--oy) * 14px + 14px) 28px rgba(0,0,0,.36),calc(var(--ox) * 40px) calc(var(--oy) * 40px + 34px) 70px rgba(0,0,0,.42)}
.carte .vue{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.carte .lumiere{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 1px rgba(0,0,0,.28),inset 0 0 26px rgba(40,35,30,.12)}
.carte .note{position:absolute;right:7%;bottom:5%;text-align:right;font-family:"Crayon",cursive;color:rgba(44,45,52,.8);line-height:.9;pointer-events:none;transform:rotate(-2deg)}
.carte .note .nom{display:block;font-size:clamp(24px,2.4vw,32px)}
.carte .note .date{display:block;font-size:clamp(19px,1.9vw,25px);opacity:.78}
.carte .invite{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:"Crayon",cursive;font-size:clamp(30px,3vw,40px);color:rgba(44,45,52,.62);pointer-events:none}
.carte .invite b{font:inherit;font-size:1.7em;line-height:.8;color:rgba(44,45,52,.5)}

<script>
// Fonds de la pile : des plans tirés des œuvres (Edgerunners, Tokyo Ghoul, Shanghai…), montés en boucle.
// Chaque fond est dans fonds/rendu/<nom>/ : affiche.jpg, carte.jpg, info.json et la vidéo VP9 en morceaux m0.webm, m1.webm…
// La vidéo démarre dès les premiers morceaux reçus (MediaSource) ; une fois tout reçu, un second lecteur prend le
// fichier entier en boucle et prend la relève à la fin du premier passage, sans coupure.
(() => {
  const FONDS = [
    { n: "lune", titre: "Edgerunners" },
    { n: "ghoul", titre: "Tokyo Ghoul" },
    { n: "herding", titre: "Tales of Herding Gods" },
    { n: "shanghai", titre: "Shanghai" },
    { n: "sekiro", titre: "Sekiro" },
    { n: "graphite", titre: "Graphite" },
  ];
  const TYPE = 'video/webm; codecs="vp9"';
  const FLUX = !!(window.MediaSource && MediaSource.isTypeSupported(TYPE));
  const dl = {};                // nom -> { morceaux: [promesse ArrayBuffer], entier: promesse d'URL }
  function telecharger(n) {
    if (!dl[n]) dl[n] = (async () => {
      const r = await fetch(`fonds/rendu/${n}/info.json`); if (!r.ok) throw new Error(r.status);
      const info = await r.json();
      const morceaux = Array.from({ length: info.morceaux }, (_, k) =>
        fetch(`fonds/rendu/${n}/m${k}.webm`).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }));
      const entier = Promise.all(morceaux).then(b => URL.createObjectURL(new Blob(b, { type: "video/webm" })));
      entier.catch(() => {});
      return { morceaux, entier };
    })().catch(e => { delete dl[n]; throw e; });
    return dl[n];
  }
  function vider(v) {
    v.onended = v.oncanplay = null; v.pause();
    if (v.dataset.flux) { URL.revokeObjectURL(v.dataset.flux); delete v.dataset.flux; }
    v.removeAttribute("src"); v.load();
    v.style.transition = ""; v.classList.remove("pret");
  }
  function creer(A, B, affiche) {
    let actuel = null, actif = false, gen = 0, visible = null;
    for (const v of [A, B]) { v.muted = true; v.defaultMuted = true; }
    const montrer = (v, doux) => {
      v.style.transition = doux ? "" : "none";
      v.classList.add("pret"); visible = v;
      if (actif) v.play().catch(() => {});
    };
    async function lancer(n, g) {
      const d = await telecharger(n);
      if (g !== gen) return;
      if (!FLUX) {                                   // sans MediaSource : on attend le fichier entier
        const url = await d.entier; if (g !== gen) return;
        A.loop = true; A.src = url;
        A.oncanplay = () => { A.oncanplay = null; if (g === gen) montrer(A, true); };
        return;
      }
      const ms = new MediaSource(), u = URL.createObjectURL(ms);
      A.loop = false; A.dataset.flux = u; A.src = u;
      A.oncanplay = () => { A.oncanplay = null; if (g === gen) montrer(A, true); };
      ms.addEventListener("sourceopen", async () => {
        try {
          const sb = ms.addSourceBuffer(TYPE);
          for (const p of d.morceaux) {
            const buf = await p; if (g !== gen) return;
            await new Promise((ok, ko) => { sb.addEventListener("updateend", ok, { once: true }); sb.addEventListener("error", ko, { once: true }); sb.appendBuffer(buf); });
          }
          if (g === gen && ms.readyState === "open") ms.endOfStream();
        } catch (e) { window.__erreurFond = String(e); }
      }, { once: true });
      // relève : le second lecteur prend le fichier entier, en boucle, prêt sur sa première image
      const url = await d.entier; if (g !== gen) return;
      B.loop = true; B.preload = "auto"; B.src = url;
      await new Promise(ok => { if (B.readyState >= 3) ok(); else B.addEventListener("canplaythrough", ok, { once: true }); });
      if (g !== gen) return;
      const relais = () => {
        if (g !== gen) return;
        B.currentTime = 0; montrer(B, false);
        requestAnimationFrame(() => requestAnimationFrame(() => { if (g === gen) vider(A); }));
      };
      if (A.ended) relais(); else A.onended = relais;
    }
    function choisir(n) {
      if (n === actuel) return;
      actuel = n; const g = ++gen;
      vider(A); vider(B); visible = null;
      if (n === "graphite") { affiche.style.display = "none"; A.style.display = B.style.display = "none"; return; }
      affiche.style.display = ""; A.style.display = B.style.display = "";
      affiche.src = `fonds/rendu/${n}/affiche.jpg`;
      lancer(n, g).catch(e => { window.__erreurFond = String(e); });
    }
    return {
      choisir,
      demarrer() { actif = true; if (visible) visible.play().catch(() => {}); },
      arreter() { actif = false; A.pause(); B.pause(); },
      redimensionner() {},
      carte: n => `fonds/rendu/${n}/carte.jpg`,
    };
  }
  window.__ambiance = { creer, NOMS: FONDS.map(f => f.n), FONDS };
})();
</script>
<script>
(() => {
"use strict";
const DPR = Math.min(window.devicePixelRatio || 1, 3);
const MM = 4.8 * DPR;          // pixels écran par millimètre sur la tablette
const MARGE = 84;              // largeur de la marge, en px CSS

// ---------- grain du papier ----------
const GR = new Float32Array(512 * 512);
(function grain() {
  const T = 512;
  let graine = 12345;
  const alea = () => ((graine = (graine * 1664525 + 1013904223) >>> 0) / 4294967296);
  function couche(cx, cy) {
    const L = new Float32Array(cx * cy);
    for (let i = 0; i < L.length; i++) L[i] = alea();
    const out = new Float32Array(T * T);
    for (let y = 0; y < T; y++) {
      const fy = y * cy / T, y0 = fy | 0, ty = fy - y0, sy = ty * ty * (3 - 2 * ty), y1 = (y0 + 1) % cy;
      for (let x = 0; x < T; x++) {
        const fx = x * cx / T, x0 = fx | 0, tx = fx - x0, sx = tx * tx * (3 - 2 * tx), x1 = (x0 + 1) % cx;
        const a = L[y0 * cx + x0], b = L[y0 * cx + x1], c = L[y1 * cx + x0], d = L[y1 * cx + x1];
        const h0 = a + (b - a) * sx, h1 = c + (d - c) * sx;
        out[y * T + x] = h0 + (h1 - h0) * sy;
      }
    }
    return out;
  }
  // le grain d'un papier à dessin : des creux de 0,2 à 0,6 mm, doux, rien au pixel près
  const k = Math.max(1, MM / 9.6);
  const n = c => Math.max(8, Math.round(c / k / 8) * 8);
  const parts = [
    [couche(n(232), n(232)), 0.46], [couche(n(136), n(136)), 0.26], [couche(n(56), n(56)), 0.10],
    [couche(24, 24), 0.08], [couche(24, n(160)), 0.05], [couche(n(160), 24), 0.05],
  ];
  for (let i = 0; i < GR.length; i++) { let s = 0; for (const [c, w] of parts) s += c[i] * w; GR[i] = s; }
  const tri = Array.from({ length: GR.length }, (_, i) => i).sort((a, b) => GR[a] - GR[b]);
  for (let r = 0; r < tri.length; r++) GR[tri[r]] = r / (tri.length - 1);
})();
const grainEn = (x, y) => GR[((y & 511) << 9) | (x & 511)];

// ---------- couleurs ----------
const PAPIER = [244, 243, 239], MINE = [50, 52, 58], ENCRE = [19, 19, 23];
const GMAX = 3, LUT_N = 2048, LUT_K = LUT_N / GMAX, LUT = new Float32Array(LUT_N + 1);
for (let i = 0; i <= LUT_N; i++) LUT[i] = 0.86 * (1 - Math.exp(-(i / LUT_K) * 0.95));

// ---------- une feuille (graphite + encre + affichage) ----------
function creerFeuille(cv, taille) {
  return {
    cv, ctx: cv.getContext("2d", { desynchronized: true, alpha: false }),
    S: taille, G: new Float32Array(taille * taille), I: new Float32Array(taille * taille),
    cw: 0, ch: 0, img: null, d32: null, ox: 0, limX: 1e9,
    sx0: Infinity, sy0: Infinity, sx1: -1, sy1: -1, enreg: null,
  };
}
function assurer(F, n) {
  if (n <= F.S) return;
  const N = n + 64, G2 = new Float32Array(N * N), I2 = new Float32Array(N * N);
  for (let y = 0; y < F.S; y++) {
    G2.set(F.G.subarray(y * F.S, y * F.S + F.S), y * N);
    I2.set(F.I.subarray(y * F.S, y * F.S + F.S), y * N);
  }
  F.S = N; F.G = G2; F.I = I2;
}
function sale(F, x0, y0, x1, y1) {
  if (x0 < F.sx0) F.sx0 = x0; if (y0 < F.sy0) F.sy0 = y0;
  if (x1 > F.sx1) F.sx1 = x1; if (y1 > F.sy1) F.sy1 = y1;
}
function boite(F, cx, cy, r) {
  return [Math.max(0, Math.floor(cx - r - 1)), Math.max(0, Math.floor(cy - r - 1)),
          Math.min(F.S - 1, F.limX - 1, Math.ceil(cx + r + 1)), Math.min(F.S - 1, Math.ceil(cy + r + 1))];
}
function composer(F, x0, y0, x1, y1) {
  x0 = Math.max(0, x0); y0 = Math.max(0, y0);
  x1 = Math.min(F.cw - 1, x1, F.S - 1); y1 = Math.min(F.ch - 1, y1, F.S - 1);
  if (x1 < x0 || y1 < y0) return;
  const { G, I, S, d32, cw, ox } = F;
  for (let y = y0; y <= y1; y++) {
    const row = y * S, out = y * cw;
    for (let x = x0; x <= x1; x++) {
      const i = row + x;
      const pa = 1 - 0.028 * (1 - grainEn(x + ox, y));
      let r = PAPIER[0] * pa, g = PAPIER[1] * pa, b = PAPIER[2] * pa;
      const gm = G[i];
      if (gm > 0.0005) {
        let k = (gm * LUT_K) | 0; if (k > LUT_N) k = LUT_N;
        const dg = LUT[k];
        r += (MINE[0] - r) * dg; g += (MINE[1] - g) * dg; b += (MINE[2] - b) * dg;
      }
      const e = I[i];
      if (e > 0) { r += (ENCRE[0] - r) * e; g += (ENCRE[1] - g) * e; b += (ENCRE[2] - b) * e; }
      d32[out + x] = 0xff000000 | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0);
    }
  }
  F.ctx.putImageData(F.img, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
}
function montrer(F) {
  if (F.sx1 < 0) return;
  composer(F, F.sx0, F.sy0, F.sx1, F.sy1);
  F.sx0 = F.sy0 = Infinity; F.sx1 = F.sy1 = -1;
}
function dimensionner(F, w, h) {
  assurer(F, Math.max(w, h));
  F.cw = w; F.ch = h;
  F.cv.width = w; F.cv.height = h;
  F.img = F.ctx.createImageData(w, h);
  F.d32 = new Uint32Array(F.img.data.buffer);
}

// ---------- retour en arrière : on garde les morceaux de feuille avant chaque trait ----------
const TU = 64;
function sauver(F, x0, y0, x1, y1) {
  const E = F.enreg;
  if (!E) return;
  const S = F.S;
  for (let ty = (y0 / TU) | 0; ty <= ((y1 / TU) | 0); ty++) {
    for (let tx = (x0 / TU) | 0; tx <= ((x1 / TU) | 0); tx++) {
      const k = ty * 65536 + tx;
      if (E.has(k)) continue;
      const bx = tx * TU, by = ty * TU, w = Math.min(TU, S - bx), h = Math.min(TU, S - by);
      if (w <= 0 || h <= 0) continue;
      const g = new Float32Array(w * h), i = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        const o = (by + y) * S + bx;
        g.set(F.G.subarray(o, o + w), y * w);
        i.set(F.I.subarray(o, o + w), y * w);
      }
      E.set(k, { bx, by, w, h, g, i });
    }
  }
}

// ---------- les outils ----------
const OUTILS = {
  crayon:    { sorte: "mine", R: 3.2,  Rp: 0.25, bord: 0.45, d0: 0.16, dp: 0.74, flux: 1.3, ec: 0.12, pexp: 1.6 },
  criterium: { sorte: "mine", R: 0.27, Rp: 0.20, bord: 0,    d0: 0.42, dp: 0.45, flux: 0.95, ec: 0.25, pexp: 1.2 },
  feutre:    { sorte: "encre", R: 0.30, ec: 0.2 }, // pointe fine qui s'écrase quand on appuie
  mouchoir:  { sorte: "mouchoir", R: 7.0, Rp: 0.15, ec: 0.16, prend: 0.12, rend: 0.07, garde: 0.004, lisse: 0.35 },
  // la mie : sa largeur vient de l'appui (rayon R0 + R1·p^1.5 en mm)
  mie:       { sorte: "mie", R0: 0.45, R1: 5.6, ec: 0.14, leve: 0.86 },
  gomme:     { sorte: "gomme", R: 2.5, Rp: 0, ec: 0.15 },
};
const TAILLES_GOMME = [2, 5, 10, 20]; // diamètre en mm
let tailleGomme = 1;
const rayon = (t, p) => t.sorte === "gomme" ? Math.max(0.8, TAILLES_GOMME[tailleGomme] / 2 * MM)
  : t.sorte === "encre" ? Math.max(0.8, MM * t.R * (0.55 + 1.1 * p * p))
  : t.sorte === "mie" ? Math.max(0.8, MM * (t.R0 + t.R1 * Math.pow(p, 1.5)))
  : Math.max(0.8, t.R * MM * (1 - t.Rp / 2 + t.Rp * p));

// le mouchoir : un carré de tissu qui porte son graphite, collé sous le doigt
const TR = Math.ceil(1.12 * OUTILS.mouchoir.R * MM) + 2, TS = 2 * TR + 1;
let tissu = new Float32Array(TS * TS); // reste sale d'un trait à l'autre
const espacement = (t, r) => Math.max(0.5, t.ec * 2 * r);

function touchMine(F, t, cx, cy, r, p, pas) {
  const [x0, y0, x1, y1] = boite(F, cx, cy, r);
  if (x1 < x0) return;
  sauver(F, x0, y0, x1, y1);
  const doux = t.bord > 0 ? t.bord * r : 0.8;
  const debit = t.flux * (pas / (2 * r)) * (0.15 + 2.2 * Math.pow(p, t.pexp));
  const prof = t.d0 + t.dp * p;
  const { G, S, ox } = F;
  // le plat d'une mine couchée n'est pas lisse : ses arêtes laissent des stries dans le sens du trait
  const strie = t.bord > 0, icx = Math.round(cx), icy = Math.round(cy);
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy, row = y * S;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx;
      let m = (r - Math.sqrt(dx * dx + dy * dy)) / doux;
      if (m <= 0) continue;
      if (m > 1) m = 1;
      const i = row + x, g = G[i];
      const pr = prof + 0.28 * (g < 2 ? g : 2) / 2;
      // contact doux : la mine touche les bosses, puis descend dans les creux quand on appuie
      let c = (grainEn(x + ox, y) - (1 - pr)) / 0.7 + 0.25;
      c = c < 0 ? 0 : c > 1 ? 1 : c;
      c = 0.3 + 0.7 * c * c * (3 - 2 * c);
      const lt = strie ? GR[((((y - icy) >> 1) + 300 & 511) << 9) | (((x - icx) >> 1) + 300 & 511)] : 0;
      const mine = strie ? 0.25 + 2.25 * lt * lt : 1;
      G[i] = g + debit * m * c * mine * (1 - g / GMAX);
    }
  }
  sale(F, x0, y0, x1, y1);
}
function touchEncre(F, cx, cy, r, sec) {
  const [x0, y0, x1, y1] = boite(F, cx, cy, r + 1);
  if (x1 < x0) return;
  sauver(F, x0, y0, x1, y1);
  const { I, S, ox } = F;
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy, row = y * S;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx;
      const h = grainEn(x + ox, y);
      let m = (r - Math.sqrt(dx * dx + dy * dy)) / 0.7 + 0.5 + (h - 0.5) * 0.55;
      if (m <= 0) continue;
      if (m > 1) m = 1;
      if (sec > 0) m *= 1 - sec * (1 - h);
      const i = row + x;
      if (m > I[i]) I[i] = m;
    }
  }
  sale(F, x0, y0, x1, y1);
}
function touchMie(F, t, cx, cy, r, p, pas) {
  const [x0, y0, x1, y1] = boite(F, cx, cy, r);
  if (x1 < x0) return;
  sauver(F, x0, y0, x1, y1);
  // ce qu'un passage enlève au centre, réparti sur les touches qui se recouvrent
  const T = t.leve * (0.7 + 0.3 * p);
  const n = 1.3 * pas / (2 * r);
  const doux = 0.4 * r + 1;
  const { G, S, ox } = F;
  // le plat d'une mine couchée n'est pas lisse : ses arêtes laissent des stries dans le sens du trait
  const strie = t.bord > 0, icx = Math.round(cx), icy = Math.round(cy);
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy, row = y * S;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx;
      let m = (r - Math.sqrt(dx * dx + dy * dy)) / doux;
      if (m <= 0) continue;
      if (m > 1) m = 1;
      const i = row + x;
      if (G[i] < 0.0005) continue;
      // la mie prend sur les bosses du papier, le creux garde un voile
      let l = T * m * (0.8 + 0.4 * grainEn(x + ox, y));
      if (l > 0.97) l = 0.97;
      G[i] *= Math.pow(1 - l, n);
    }
  }
  sale(F, x0, y0, x1, y1);
}
function touchGomme(F, cx, cy, r) {
  const [x0, y0, x1, y1] = boite(F, cx, cy, r);
  if (x1 < x0) return;
  sauver(F, x0, y0, x1, y1);
  const { G, I, S } = F;
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy, row = y * S;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx;
      let m = r + 0.5 - Math.sqrt(dx * dx + dy * dy);
      if (m <= 0) continue;
      if (m > 1) m = 1;
      const i = row + x;
      G[i] *= 1 - m; I[i] *= 1 - m;
    }
  }
  sale(F, x0, y0, x1, y1);
}
function touchMouchoir(F, t, cx, cy, r, p, st) {
  let [x0, y0, x1, y1] = boite(F, cx, cy, r);
  x0 = Math.max(1, x0); y0 = Math.max(1, y0); x1 = Math.min(F.S - 2, x1); y1 = Math.min(F.S - 2, y1);
  if (x1 < x0) return;
  sauver(F, x0, y0, x1, y1);
  const T = st && st.tissu ? st.tissu : (tissu);
  const { G, S, ox } = F;
  const s0 = 0.35 + 0.65 * p;
  const icx = Math.round(cx), icy = Math.round(cy);
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy, row = y * S, v = y - icy + TR;
    if (v < 0 || v >= TS) continue;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx, q = (dx * dx + dy * dy) / (r * r);
      if (q >= 1) continue;
      const u = x - icx + TR;
      if (u < 0 || u >= TS) continue;
      const s = s0 * (1 - q);
      // la trame du tissu (elle se déplace avec le doigt : elle laisse des traînées dans le sens du geste)
      const fb = GR[(((v * 5) & 511) << 9) | ((u * 5 + 131) & 511)];
      const gr = grainEn(x + ox, y);
      const i = row + x, g = G[i], ti = v * TS + u, tv = T[ti];
      const prend = t.prend * s * (0.4 + 1.2 * fb) * (0.7 + 0.6 * gr) * g;
      const rend = t.rend * s * (0.4 + 1.2 * fb) * tv;
      // le frottement pousse le graphite dans les creux du papier
      const voisins = (G[i - 1] + G[i + 1] + G[i - S] + G[i + S]) * 0.25;
      G[i] = g - prend + rend + (voisins - g) * t.lisse * s;
      T[ti] = (tv + prend - rend) * (1 - t.garde * s);
    }
  }
  sale(F, x0, y0, x1, y1);
}
// un contact de l'outil ; renvoie l'espacement jusqu'au suivant
function touche(F, cle, x, y, p, k, ddx, ddy, vitesse, st) {
  const t = OUTILS[cle];
  const r = rayon(t, p) * k;
  const pas = espacement(t, r);
  if (t.sorte === "mine") touchMine(F, t, x, y, r, p, pas);
  else if (t.sorte === "encre") touchEncre(F, x, y, r, Math.min(0.25, Math.max(0, (vitesse / MM - 0.8) / 2)));
  else if (t.sorte === "mie") touchMie(F, t, x, y, r, p, pas);
  else if (t.sorte === "gomme") touchGomme(F, x, y, r);
  else touchMouchoir(F, t, x, y, r, p, st);
  return pas;
}
// fait avancer un trait jusqu'au point suivant
function avancer(F, s, cle, nx, ny, np, k) {
  const dx = nx - s.x, dy = ny - s.y, dist = Math.hypot(dx, dy);
  if (dist < 0.01) { s.p = np; return; }
  const ux = dx / dist, uy = dy / dist;
  const t = OUTILS[cle];
  let suivant = s.reste, garde = 0;
  while (suivant <= dist && garde++ < 4000) {
    const f = suivant / dist, p = s.p + (np - s.p) * f;
    const pas = espacement(t, rayon(t, p) * k);
    touche(F, cle, s.x + dx * f, s.y + dy * f, p, k, ux * pas, uy * pas, s.v, s);
    suivant += pas;
  }
  s.reste = suivant - dist;
  s.x = nx; s.y = ny; s.p = np;
}
// trait tracé par l'appli elle-même (pour la marge), points en px CSS
function tracer(F, cle, pts, k = 1) {
  const [x, y, p] = pts[0];
  const e = F.echelle || DPR;
  const s = { x: x * e, y: y * e, p, v: 0, reste: 0, tissu: new Float32Array(TS * TS) };
  if (OUTILS[cle].sorte !== "mouchoir") s.reste = touche(F, cle, s.x, s.y, p, k, 0, 0, 0);
  for (let i = 1; i < pts.length; i++) avancer(F, s, cle, pts[i][0] * e, pts[i][1] * e, pts[i][2], k);
}

// T : repère d'un objet (centre, angle) ; x le long de l'objet, y en travers ; tout en px CSS
function repere(cx, cy, a, ech = 1) {
  const c = Math.cos(a) * ech, s = Math.sin(a) * ech;
  return (x, y, p = 0.5) => [cx + x * c - y * s, cy + x * s + y * c, p];
}
let tremble = 1;
const main = () => ((tremble = (tremble * 16807) % 2147483647) / 2147483647 - 0.5);
// un trait à la main : on découpe en petits pas et on laisse trembler un peu
function tr(F, cle, T, pts, k = 1, mou = 0.18) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const [x, y, p] = pts[i];
    if (i > 0) {
      const [x0, y0, p0] = pts[i - 1];
      const n = Math.max(1, Math.ceil(Math.hypot(x - x0, y - y0) / 1.5));
      for (let j = 1; j < n; j++) { const t = j / n; out.push(T(x0 + (x - x0) * t + main() * mou, y0 + (y - y0) * t + main() * mou, p0 + (p - p0) * t)); }
    }
    out.push(T(x + main() * mou, y + main() * mou, p));
  }
  tracer(F, cle, out, k);
}
// courbe passant par des points (Catmull-Rom)
function lisse(pts, ferme = false, n = 8) {
  const out = [], m = pts.length;
  const P = i => ferme ? pts[(i + m) % m] : pts[Math.max(0, Math.min(m - 1, i))];
  const fin = ferme ? m : m - 1;
  for (let i = 0; i < fin; i++) {
    const a = P(i - 1), b = P(i), c = P(i + 1), d = P(i + 2);
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      const f = (u, v, w, z) => 0.5 * (2 * v + (-u + w) * t + (2 * u - 5 * v + 4 * w - z) * t2 + (-u + 3 * v - 3 * w + z) * t3);
      out.push([f(a[0], b[0], c[0], d[0]), f(a[1], b[1], c[1], d[1]), b[2] + (c[2] - b[2]) * t]);
    }
  }
  out.push(ferme ? [...pts[0]] : [...pts[m - 1]]);
  return out;
}
// remplir une bande au crayon couché (va-et-vient en travers, en avançant le long)
function hachure(F, T, x0, x1, haut, bas, p, k, pas = 1.2) {
  const pts = [];
  let sens = 0;
  for (let x = x0; x <= x1 + 0.01; x += pas) { pts.push([x, sens ? bas(x) : haut(x), p]); sens ^= 1; }
  tr(F, "crayon", T, pts, k, 0.1);
}
function estompe(F, T, pts, k) { tr(F, "mouchoir", T, pts, k, 0.3); }
function gommerT(F, T, pts, r) {
  const e = F.echelle || DPR;
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = T(pts[i - 1][0], pts[i - 1][1]), [bx, by] = T(pts[i][0], pts[i][1]);
    const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 0.5));
    for (let j = 0; j <= n; j++) touchGomme(F, (ax + (bx - ax) * j / n) * e, (ay + (by - ay) * j / n) * e, r * e);
  }
}
// ombre d'un objet posé ou soulevé : du graphite estompé sous sa silhouette
function ombre(F, T, x0, x1, hw, force, flou) {
  hachure(F, T, x0, x1, () => -hw * 0.7, () => hw * 0.7, force, 0.1, 0.9);
  const k = Math.max(flou, hw * 1.5 / 33.6);
  for (let j = 0; j < 3; j++) {
    const pts = [];
    for (let x = x0 - 3, s = 0; x <= x1 + 3; x += 2.2, s++) pts.push([x, Math.sin(s * 1.3 + j) * hw * 0.6, 0.7]);
    estompe(F, T, j % 2 ? pts.reverse() : pts, k);
  }
}

// posé dans la marge : angle (pointe vers la feuille, en haut à gauche)
const POSE = { crayon: -2.55, criterium: -2.62, feutre: -2.5, mouchoir: -0.12, mie: 0.15, gomme: -0.5 };

// ======================================================================
// une feuille qu'on rend en image transparente (marques, ombres)
// ======================================================================
function feuilleLibre(wCss, hCss, ech = DPR) {
  const S = Math.ceil(Math.max(wCss, hCss) * ech) + 4;
  return { S, G: new Float32Array(S * S), I: new Float32Array(S * S), cw: 0, ch: 0, ox: 0, limX: 1e9, echelle: ech,
           sx0: Infinity, sy0: Infinity, sx1: -1, sy1: -1, enreg: null, wCss, hCss };
}
function versTransparent(T) {
  const e = T.echelle, w = Math.round(T.wCss * e), h = Math.round(T.hCss * e);
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * T.S + x, o = (y * w + x) * 4;
    const gm = T.G[i];
    let ag = 0;
    if (gm > 0.0005) { let k = (gm * LUT_K) | 0; if (k > LUT_N) k = LUT_N; ag = LUT[k]; }
    const e2 = T.I[i], a = 1 - (1 - ag) * (1 - e2);
    if (a <= 0.002) continue;
    for (let c = 0; c < 3; c++) d[o + c] = (MINE[c] * ag * (1 - e2) + ENCRE[c] * e2) / a;
    d[o + 3] = a * 255;
  }
  ctx.putImageData(img, 0, 0);
  cv.style.width = T.wCss + "px"; cv.style.height = T.hCss + "px";
  return cv;
}

// la feuille principale et la marge

const zone0 = Math.ceil(Math.max(screen.width || 0, screen.height || 0, innerWidth, innerHeight, 256) * DPR) + 4;
const F = creerFeuille(document.getElementById("feuille"), zone0);
const M = creerFeuille(document.getElementById("marge"), Math.ceil(Math.max(MARGE, 256) * DPR) + 4);
const ELT = { dessin: document.getElementById("dessin"), pile: document.getElementById("pile"),
              cartes: document.getElementById("cartes"), fond: document.getElementById("fond") };
ELT.contenu = ELT.cartes.firstElementChild;
let outil = "crayon";
const histo = [];
const HISTO_MAX = 80;
let vue = "pile";

function dimensionnerTout() {
  const w = Math.max(1, Math.round(innerWidth * DPR)), h = Math.max(1, Math.round(innerHeight * DPR));
  if (w !== F.cw || h !== F.ch) {
    dimensionner(F, w, h);
    const mw = Math.round(MARGE * DPR);
    F.limX = w - mw;
    composer(F, 0, 0, w - 1, h - 1);
    dimensionner(M, mw, h);
    M.ox = w - mw;
    M.limX = 1e9;
    cacheMarge.clear();
    dessinerMarge();
  }
  if (vue === "pile" && taillePile !== innerWidth + "x" + innerHeight) { disposerPile(); AMB.redimensionner(); }
}

// ---------- la marge : les outils posés à côté de la feuille ----------
let zones = [];
const cacheMarge = new Map();
const ORDRE = ["crayon", "criterium", "feutre", "mouchoir", "mie", "gomme"];
function dessinerMarge() {
  const cle = outil + "/" + (outil === "gomme" ? tailleGomme : "");
  const H = M.ch / DPR;
  zones = [];
  const cx = 47, haut = 8, pas = 64;
  let y0 = haut;
  const plan = [];
  for (const o of ORDRE) {
    plan.push([o, y0 + pas / 2]);
    zones.push({ y0, y1: y0 + pas, faire: () => choisir(o) });
    y0 += pas;
    if (o === "gomme" && outil === "gomme") {
      TAILLES_GOMME.forEach((_, i) => {
        const col = i % 2, lig = (i / 2) | 0;
        const ccx = 30 + col * 34, ccy = y0 + 16 + lig * 32;
        zones.push({ y0: ccy - 16, y1: ccy + 16, x0: ccx - 17, x1: ccx + 17, faire: () => { tailleGomme = i; dessinerMarge(); } });
      });
      y0 += 70;
    }
  }
  const yR = Math.max(y0 + 14, Math.min(H * 0.6, H - 150));
  zones.push({ y0: yR - 4, y1: yR + 64, faire: annuler });
  zones.push({ y0: H - 70, y1: H, faire: () => allerPile() });

  const deja = cacheMarge.get(cle);
  if (deja && deja.length === M.d32.length) { M.d32.set(deja); M.ctx.putImageData(M.img, 0, 0); return; }

  M.G.fill(0); M.I.fill(0);
  tremble = 7;
  // le trait de marge, à la main
  {
    const pts = [];
    for (let y = -4; y <= H + 4; y += 12) pts.push([5 + Math.sin(y * 0.013) * 0.8, y, 0.32]);
    tracer(M, "criterium", pts);
  }
  for (const [o, cy] of plan) {
    const pris = o === outil;
    const S = SILHOUETTE[o], a = POSE[o] + (pris ? 0.12 : 0);
    const ox = pris ? cx - 5 : cx, oy = pris ? cy - 3 : cy;
    // l'outil en main est soulevé : son ombre s'écarte et s'élargit
    if (pris) ombre(M, repere(ox + 6, oy + 9, a, 1.04), S[0] + 2, S[1] - 2, S[2] * 1.1, 0.6, 0.2);
    else ombre(M, repere(ox + 1, oy + 1.5, a), S[0] + 4, S[1] - 4, S[2] * 0.6, 0.2, 0.12);
    OBJETS[o](M, repere(ox, oy, a, pris ? 1.1 : 1));
  }
  // tailles de la gomme
  if (outil === "gomme") {
    const yg = plan[5][1] + pas / 2;
    const vues = [4, 7, 10.5, 14];
    TAILLES_GOMME.forEach((_, i) => {
      const col = i % 2, lig = (i / 2) | 0;
      const ccx = 30 + col * 34, ccy = yg + 16 + lig * 32;
      const choisie = i === tailleGomme;
      const pts = [];
      for (let j = 0; j <= 60; j++) { const t = -1.4 + j / 60 * Math.PI * 2 * (choisie ? 1.06 : 1); pts.push([ccx + Math.cos(t) * vues[i], ccy + Math.sin(t) * vues[i], choisie ? 0.6 : 0.4]); }
      tracer(M, choisie ? "feutre" : "criterium", pts, choisie ? 0.8 : 1);
    });
  }
  // retour en arrière : une boucle à l'encre
  {
    const ccx = cx, ccy = yR + 30, R = 16;
    const pts = [];
    for (let t = 0; t <= 1.0001; t += 0.04) {
      const a = -0.35 + t * 4.2;
      pts.push([ccx + Math.cos(a) * R, ccy - Math.sin(a) * R, 0.5 + 0.3 * Math.sin(t * Math.PI)]);
    }
    tracer(M, "feutre", pts, 0.9);
    const fin = pts[pts.length - 1], ang = -0.35 + 4.2;
    const tx = -Math.sin(ang), ty = -Math.cos(ang), nx = Math.cos(ang), ny = -Math.sin(ang);
    tracer(M, "feutre", [[fin[0] - tx * 8 + nx * 5.5, fin[1] - ty * 8 + ny * 5.5, 0.5], [fin[0], fin[1], 0.7]], 0.9);
    tracer(M, "feutre", [[fin[0] - tx * 8 - nx * 5.5, fin[1] - ty * 8 - ny * 5.5, 0.5], [fin[0], fin[1], 0.7]], 0.9);
  }
  // le coin de la feuille, relevé : dessous, la pile
  {
    const W = M.cw / DPR, s = 44, X = W, Y = H;
    const I = repere(0, 0, 0);
    // ce qu'on voit sous le coin : le gris de la pile
    for (let j = 0; j < 3; j++) {
      const pts = [];
      for (let u = 0; u <= s; u += 1.3) pts.push([X - u + 0.5, Y + 1, 0.95], [X + 1, Y - (s - u) - 0.5 + (j % 2), 0.95]);
      tr(M, "crayon", I, pts, 0.1, 0.05);
    }
    estompe(M, I, [[X - s * 0.6, Y - 3, 0.5], [X - 3, Y - s * 0.6, 0.5]], 0.07);
    // le rabat : un triangle de papier replié vers l'intérieur, qui fait un peu d'ombre sur la feuille
    const A = [X - s, Y], B = [X, Y - s], C = [X - s * 0.84, Y - s * 0.84];
    ombre(M, repere(C[0] + 2, C[1] + 2, -Math.PI / 4), -s * 0.46, s * 0.46, 6, 0.4, 0.12);
    for (let u = 0; u <= 1.0001; u += 0.03) gommerT(M, I, [[A[0] + (C[0] - A[0]) * u, A[1] + (C[1] - A[1]) * u], [B[0] + (C[0] - B[0]) * u, B[1] + (C[1] - B[1]) * u]], 1.1);
    // le pli fait un léger gris sur le rabat
    tr(M, "crayon", I, [[A[0] + 5, A[1] - 3, 0.25], [B[0] - 3, B[1] + 5, 0.25]], 0.1, 0.1);
    estompe(M, I, [[A[0] + 7, A[1] - 5, 0.4], [B[0] - 5, B[1] + 7, 0.4]], 0.06);
    tr(M, "feutre", I, [[A[0], A[1], 0.12], [C[0], C[1], 0.16], [B[0], B[1], 0.12]], 0.7, 0.1);
    tr(M, "criterium", I, [[A[0], A[1], 0.45], [B[0], B[1], 0.45]], 0.8, 0.1);
  }
  composer(M, 0, 0, M.cw - 1, M.ch - 1);
  M.sx0 = M.sy0 = Infinity; M.sx1 = M.sy1 = -1;
  cacheMarge.set(cle, M.d32.slice());
}
function choisir(cle) {
  outil = cle;
  dessinerMarge();
}

// ---------- retour en arrière ----------
function annuler() {
  const e = histo.pop();
  if (!e) return;
  if (e.tissu) tissu = e.tissu;
  for (const t of e.tuiles.values()) {
    if (t.bx + t.w > F.S || t.by + t.h > F.S) continue;
    for (let y = 0; y < t.h; y++) {
      const o = (t.by + y) * F.S + t.bx;
      F.G.set(t.g.subarray(y * t.w, y * t.w + t.w), o);
      F.I.set(t.i.subarray(y * t.w, y * t.w + t.w), o);
    }
    sale(F, t.bx, t.by, t.bx + t.w - 1, t.by + t.h - 1);
  }
  montrer(F);
  modifie = true; planifier();
}
function memoriser(e) {
  histo.push(e);
  while (histo.length > HISTO_MAX) histo.shift();
}

// ---------- dessiner ----------
let trait = null;
function point(cv, e) {
  const rc = cv.getBoundingClientRect();
  return [(e.clientX - rc.left) * cv.width / rc.width, (e.clientY - rc.top) * cv.height / rc.height];
}
function pression(e) {
  if (e.pointerType === "mouse") return 0.5;
  return e.pressure > 0 ? Math.min(1, e.pressure) : 0.05;
}
F.cv.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch") return; // la main et les doigts ne dessinent pas
  e.preventDefault();
  try { F.cv.setPointerCapture(e.pointerId); } catch (_) {}
  const [x, y] = point(F.cv, e);
  const p = pression(e);
  F.enreg = new Map();
  trait = { id: e.pointerId, x, y, p, t: e.timeStamp, v: 0, reste: 0, cle: outil, tissu,
            tissuAvant: outil === "mouchoir" ? tissu.slice() : null };
  if (OUTILS[outil].sorte !== "mouchoir") trait.reste = touche(F, outil, x, y, p, 1, 0, 0, 0);
  montrer(F);
});
F.cv.addEventListener("pointermove", e => {
  if (!trait || e.pointerId !== trait.id) return;
  e.preventDefault();
  const liste = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
  for (const ev of (liste.length ? liste : [e])) {
    const [x, y] = point(F.cv, ev);
    const dt = Math.max(1, ev.timeStamp - trait.t);
    trait.v = trait.v * 0.7 + (Math.hypot(x - trait.x, y - trait.y) / dt) * 0.3;
    trait.t = ev.timeStamp;
    avancer(F, trait, trait.cle, x, y, pression(ev), 1);
  }
  montrer(F);
});
function finir(e) {
  if (!trait || e.pointerId !== trait.id) return;
  if (F.enreg && F.enreg.size) { memoriser({ tuiles: F.enreg, tissu: trait.tissuAvant }); modifie = true; }
  trait = null;
  F.enreg = null;
  montrer(F);
  planifier();
}
F.cv.addEventListener("pointerup", finir);
F.cv.addEventListener("pointercancel", finir);

M.cv.addEventListener("pointerdown", e => {
  e.preventDefault();
  const rc = M.cv.getBoundingClientRect();
  const x = e.clientX - rc.left, y = e.clientY - rc.top;
  const z = zones.find(z => y >= z.y0 && y <= z.y1 && (z.x0 === undefined || (x >= z.x0 && x <= z.x1)))
         || zones.find(z => z.x0 === undefined && y >= z.y0 && y <= z.y1);
  if (z) z.faire();
});
for (const cv of [F.cv, M.cv]) {
  cv.addEventListener("contextmenu", e => e.preventDefault());
  cv.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
}

// ======================================================================
// les dessins gardés sur la tablette
// ======================================================================
let courant = null;      // { id, cree }
let modifie = false, minuterieSauve = 0, sauveEnCours = null;
let baseP = null;
function base() {
  if (!baseP) baseP = new Promise(res => {
    try {
      const r = indexedDB.open("feuille", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("dessins", { keyPath: "id" });
      r.onsuccess = () => res(r.result);
      r.onerror = r.onblocked = () => res(null);
    } catch (_) { res(null); }
  });
  return baseP;
}
async function requete(mode, fn) {
  let db = await base();
  // une ouverture ratée (base encore tenue au démarrage) ne doit pas faire croire qu'il n'y a rien : on réessaie
  for (let k = 0; !db && k < 8; k++) { baseP = null; await new Promise(r => setTimeout(r, 300)); db = await base(); }
  if (!db) throw new Error("base indisponible");
  return new Promise((res, rej) => {
    let r;
    try {
      const tx = db.transaction("dessins", mode);
      r = fn(tx.objectStore("dessins"));
      tx.oncomplete = () => res(r ? r.result : null);
      tx.onerror = tx.onabort = () => rej(tx.error);
    } catch (e) { rej(e); }
  });
}
const tousLesDessins = () => requete("readonly", s => s.getAll()).catch(() => null);
const lireDessin = id => requete("readonly", s => s.get(id)).catch(() => null);
const ecrireDessin = rec => requete("readwrite", s => s.put(rec));
const jeterDessin = id => requete("readwrite", s => s.delete(id));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (_) {}

async function compresser(buf) {
  if (window.CompressionStream) {
    const s = new Blob([buf]).stream().pipeThrough(new CompressionStream("gzip"));
    return { blob: await new Response(s).blob(), gz: true };
  }
  return { blob: new Blob([buf]), gz: false };
}
async function decompresser(blob, gz) {
  if (gz) return new Response(blob.stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
  return blob.arrayBuffer();
}
function planifier() {
  clearTimeout(minuterieSauve);
  if (modifie) minuterieSauve = setTimeout(() => { if (trait) planifier(); else sauver_(); }, 1500);
}
async function sauver_() {
  clearTimeout(minuterieSauve);
  if (!courant || !modifie) return sauveEnCours;
  if (sauveEnCours) { await sauveEnCours; return sauver_(); }
  modifie = false;
  sauveEnCours = (async () => {
    const w = F.limX, h = F.ch, S = F.S, n = w * h;
    const buf = new ArrayBuffer(n * 3), g16 = new Uint16Array(buf, 0, n), i8 = new Uint8Array(buf, n * 2, n);
    const q = 65535 / GMAX;
    for (let y = 0; y < h; y++) {
      const o = y * S, d = y * w;
      for (let x = 0; x < w; x++) { g16[d + x] = Math.min(65535, F.G[o + x] * q + 0.5); i8[d + x] = F.I[o + x] * 255 + 0.5; }
    }
    const apercu = await vignette(F.cv, w, h);
    const { blob, gz } = await compresser(buf);
    await ecrireDessin({ id: courant.id, cree: courant.cree, modifie: Date.now(), w, h, dpr: DPR, gz, donnees: blob, apercu, nom: courant.nom || "", carnet: courant.carnet || "", temps: Math.round(courant.temps || 0) });
  })().catch(() => { modifie = true; }).finally(() => { sauveEnCours = null; });
  return sauveEnCours;
}
function vignette(src, w, h) {
  const tw = Math.min(w, 1280), th = Math.round(h * tw / w);
  const c = document.createElement("canvas");
  c.width = tw; c.height = th;
  const ctx = c.getContext("2d");
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(src, 0, 0, w, h, 0, 0, tw, th);
  return new Promise(res => c.toBlob(b => res(b), "image/jpeg", 0.9));
}
async function chargerDans(rec, G, I, S, dpr = DPR) {
  const ab = await decompresser(rec.donnees, rec.gz);
  const n = rec.w * rec.h, g16 = new Uint16Array(ab, 0, n), i8 = new Uint8Array(ab, n * 2, n);
  const q = GMAX / 65535;
  // si l'écran n'a plus la même densité, on remet le dessin à sa taille réelle
  const f = dpr / (rec.dpr || dpr);
  const w = Math.min(Math.round(rec.w * f), S), h = Math.min(Math.round(rec.h * f), S);
  for (let y = 0; y < h; y++) {
    const o = y * S;
    if (f === 1) {
      const d = y * rec.w;
      for (let x = 0; x < w; x++) { G[o + x] = g16[d + x] * q; I[o + x] = i8[d + x] / 255; }
      continue;
    }
    const sy = Math.min(rec.h - 1, (y + 0.5) / f - 0.5), y0 = Math.max(0, Math.floor(sy)), y1 = Math.min(rec.h - 1, y0 + 1), ty = Math.max(0, sy - y0);
    for (let x = 0; x < w; x++) {
      const sx = Math.min(rec.w - 1, (x + 0.5) / f - 0.5), x0 = Math.max(0, Math.floor(sx)), x1 = Math.min(rec.w - 1, x0 + 1), tx = Math.max(0, sx - x0);
      const a = y0 * rec.w + x0, b = y0 * rec.w + x1, c = y1 * rec.w + x0, d = y1 * rec.w + x1;
      const mix = (A) => (A[a] * (1 - tx) + A[b] * tx) * (1 - ty) + (A[c] * (1 - tx) + A[d] * tx) * ty;
      G[o + x] = mix(g16) * q; I[o + x] = mix(i8) / 255;
    }
  }
}
// pour la galerie : le dessin en grand, tel qu'il est sur la feuille
async function imageComplete(rec) {
  const w = rec.w, h = rec.h, S = Math.max(w, h);
  const T = { S, G: new Float32Array(S * S), I: new Float32Array(S * S), cw: w, ch: h, ox: 0, ctx: null };
  await chargerDans(rec, T.G, T.I, S, rec.dpr || DPR);
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  T.ctx = c.getContext("2d");
  T.img = T.ctx.createImageData(w, h);
  T.d32 = new Uint32Array(T.img.data.buffer);
  composer(T, 0, 0, w - 1, h - 1);
  return new Promise(res => c.toBlob(b => res(b), "image/png"));
}
async function versGalerie(rec) {
  const blob = await imageComplete(rec);
  const d = new Date(rec.modifie || Date.now()), z = v => String(v).padStart(2, "0");
  const nom = `dessin ${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}h${z(d.getMinutes())}.png`;
  if (window.FeuilleApp) {
    const b64 = await new Promise(res => { const f = new FileReader(); f.onload = () => res(String(f.result).split(",")[1]); f.readAsDataURL(blob); });
    window.FeuilleApp.enregistrer(nom, b64);
    return;
  }
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (_) {}
  if (dl) { try { await dl.save({ filename: nom, data: blob }); } catch (_) {} return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { sauver_(); AMB.arreter(); }
  else if (vue === "pile") AMB.demarrer();
});
addEventListener("pagehide", () => sauver_());

let fondFait = "";
function dessinerFond() {
  const W = innerWidth, H = innerHeight, cle = W + "x" + H;
  if (fondFait === cle) return;
  fondFait = cle;
  const P = feuilleLibre(W, H, 1);
  P.cv = ELT.fond; P.ctx = ELT.fond.getContext("2d", { alpha: false });
  P.cw = W; P.ch = H; P.cv.width = W; P.cv.height = H;
  P.img = P.ctx.createImageData(W, H); P.d32 = new Uint32Array(P.img.data.buffer);
  const k = f => f / DPR;
  const I = repere(0, 0, 0);
  tremble = 3;
  // le gris couché à plat, en longs traits un peu penchés
  for (let y = -20, n = 0; y < H + 30; y += 8, n++) {
    const pts = [];
    for (let x = -30; x <= W + 30; x += 40) pts.push([x, y + x * 0.06 + Math.sin(x * 0.01 + n) * 3, 0.62 + 0.18 * Math.sin(x * 0.004 + n * 0.7)]);
    tracer(P, "crayon", pts, k(0.9));

  ch.focus();
  let fait = false;
  const ok = () => { if (fait) return; fait = true; const v = ch.value.trim(); if (v && !reglages.carnets.includes(v)) reglages.carnets.push(v); if (v) reglages.carnet = v; garderReglages(); disposerPile(); };
  ch.addEventListener("keydown", e => { if (e.key === "Enter") ok(); if (e.key === "Escape") { fait = true; disposerPile(); } });
  ch.addEventListener("blur", ok);
}

// ---- choisir le décor : les affiches, en grand ----
function ouvrirFonds() {
  if (document.getElementById("fonds")) return;
  const B = el("div"); B.id = "fonds";
  B.append(el("h2", null, "Décors"));
  const rang = el("div", "rang");
  window.__ambiance.NOMS.forEach((n, i) => {
    const s = SCENES[n];
    const t = el("button", "decor" + (reglages.scene === n ? " actif" : ""));
    t.style.setProperty("--c", n === "graphite" ? "#d9dade" : s.accent);
    t.style.transitionDelay = 60 + i * 60 + "ms, " + (60 + i * 60) + "ms, 0ms";
    const im = el("img"); im.alt = "";
    if (n !== "graphite") im.src = `fonds/rendu/${n}/affiche.jpg`;
    else { im.classList.add("graphite"); try { dessinerFond(); im.src = ELT.fond.toDataURL("image/jpeg", 0.85); } catch (_) {} }
    t.append(im, el("span", "kanji", s.kanji), el("span", "nom", s.nom));
    t.addEventListener("click", e => { e.stopPropagation(); choisirScene(n); fermerFonds(); });
    rang.append(t);
  });
  B.append(rang);
  B.addEventListener("pointerup", e => { if (e.target === B || e.target.tagName === "H2") fermerFonds(); });
  document.body.appendChild(B);
  ELT.pile.classList.add("choix");
  requestAnimationFrame(() => requestAnimationFrame(() => B.classList.add("ouvert")));
  const actif = rang.querySelector(".actif");
  if (actif) rang.scrollLeft = Math.max(0, actif.offsetLeft - innerWidth / 2 + actif.offsetWidth / 2);
}
function fermerFonds() {
  const B = document.getElementById("fonds");
  if (!B) return;
  B.classList.remove("ouvert");
  ELT.pile.classList.remove("choix");
  setTimeout(() => B.remove(), 420);
}

// ---- toucher l'accueil ----
{
  let depart = null, minuterie = 0, longue = false, bouge = false;
  const relacher = () => { if (depart && depart.carte) depart.carte.classList.remove("presse"); };
  ELT.cartes.addEventListener("pointerdown", e => {
    if (enMouvement) return;
    const carte = e.target.closest(".carte");
    depart = { x: e.clientX, y: e.clientY, carte, cible: e.target };
    longue = false; bouge = false;
    clearTimeout(minuterie);
    if (carte && !menuOuvert) carte.classList.add("presse");
    if (carte && carte.dataset.id !== "nouvelle") minuterie = setTimeout(() => { longue = true; ouvrirMenu(carte); }, 450);
  });
  ELT.cartes.addEventListener("pointermove", e => {
    if (depart && !bouge && Math.hypot(e.clientX - depart.x, e.clientY - depart.y) > 10) { clearTimeout(minuterie); bouge = true; relacher(); }
  });
  ELT.cartes.addEventListener("pointerup", e => {
    clearTimeout(minuterie);
    if (!depart) return;
    relacher();
    const d = depart; depart = null;
    if (longue) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (bouge) {
      if (!d.carte && Math.abs(dx) > 90 && Math.abs(dx) > Math.abs(dy) * 1.5) changerScene(dx < 0 ? 1 : -1);
      return;
    }
    if (menuOuvert) { fermerMenu(); return; }
    const t = d.cible;
    if (t.closest(".lieu")) return ouvrirFonds();
    const o = t.closest(".onglet");
    if (o && o.classList.contains("ajout")) return nouveauCarnet();
    if (o && o.dataset.carnet) { reglages.carnet = o.dataset.carnet; garderReglages(); return disposerPile(); }
    if (d.carte) ouvrir(d.carte);
  });
  // Android interrompt un appui long (pointercancel) pour son propre menu : l'appui long reste un appui long
  ELT.cartes.addEventListener("pointercancel", () => {
    if (depart && depart.carte && !bouge && !longue) {
      const carte = depart.carte;
      clearTimeout(minuterie);
      if (carte.dataset.id !== "nouvelle") { longue = true; ouvrirMenu(carte); } else carte.classList.remove("presse");
    } else { clearTimeout(minuterie); relacher(); }
    depart = null;
  });
  ELT.cartes.addEventListener("contextmenu", e => {
    e.preventDefault();
    const carte = e.target.closest && e.target.closest(".carte");
    if (carte && carte.dataset.id !== "nouvelle" && !menuOuvert) { clearTimeout(minuterie); longue = true; depart = null; ouvrirMenu(carte); }
  });
}

// ---------- changer de décor ; l'ancien s'efface dans le nouveau ----------
function sourceVisible() {
  for (const id of ["ciel2", "ciel"]) {
    const v = document.getElementById(id);
    if (v.classList.contains("pret") && v.readyState >= 2 && v.videoWidth) return v;
  }
  const a = document.getElementById("affiche");
  if (reglages.scene !== "graphite" && a.complete && a.naturalWidth) return a;
  if (reglages.scene === "graphite" && ELT.fond.width > 1) return ELT.fond;
  return null;
}
function changerScene(sens) {
  const N = window.__ambiance.NOMS, i = N.indexOf(reglages.scene);
  choisirScene(N[(i + sens + N.length) % N.length]);
}
function choisirScene(nom) {
  if (nom === reglages.scene) return;
  const src = sourceVisible();
  let inst = document.getElementById("instant");
  if (inst) inst.remove();
  if (src) {
    inst = document.createElement("canvas");
    inst.id = "instant";
    const D = document.getElementById("decor"), w = D.offsetWidth, h = D.offsetHeight;
    inst.width = Math.round(w * Math.min(DPR, 1.5)); inst.height = Math.round(h * Math.min(DPR, 1.5));
    const x = inst.getContext("2d");
    const sw = src.videoWidth || src.naturalWidth || src.width, sh = src.videoHeight || src.naturalHeight || src.height;
    const k = Math.max(inst.width / sw, inst.height / sh);
    try { x.drawImage(src, (inst.width - sw * k) / 2, (inst.height - sh * k) / 2, sw * k, sh * k); } catch (_) {}
    D.appendChild(inst);
  }
  reglages.scene = nom;
  garderReglages();
  appliquerAmbiance();
  const s = SCENES[nom];
  const b = ELT.contenu.querySelector(".lieu");
  if (b) { b.querySelector(".kanji").textContent = s.kanji; b.querySelector(".nom").textContent = s.nom; }
  if (inst) {
    const aff = document.getElementById("affiche");
    const partir = () => { inst.style.opacity = 0; setTimeout(() => inst.remove(), 1100); };
    if (nom === "graphite" || (aff.complete && aff.naturalWidth)) requestAnimationFrame(() => requestAnimationFrame(partir));
    else { aff.addEventListener("load", partir, { once: true }); aff.addEventListener("error", partir, { once: true }); setTimeout(partir, 1500); }
  }
}

// ---------- la lumière du décor tombe sur les feuilles, et l'écriture prend la couleur qui se lit ----------
let dernierJour = "";
{
  const c = document.createElement("canvas"), CW = 24, CH = 15;
  c.width = CW; c.height = CH;
  const x = c.getContext("2d", { willReadFrequently: true });
  let clair = false;
  const regarder = () => {
    if (vue !== "pile" || document.visibilityState === "hidden") return;
    const src = sourceVisible();
    let R = 0.97, G = 0.97, B = 0.97, ang = 135, ecart = 0.1, reflet = "rgba(255,255,255,0)";
    if (!src) return;
    try {
      x.drawImage(src, 0, 0, CW, CH);
      const d = x.getImageData(0, 0, CW, CH).data;
      let sr = 0, sg = 0, sb = 0, sl = 0, lm = 0, cxl = 0, cyl = 0, poids = 0, vr = 0, vg = 0, vb = 0, lt = 0, nt = 0;
      for (let j = 0; j < CH; j++) for (let i = 0; i < CW; i++) {
        const o = (j * CW + i) * 4, r = d[o] / 255, g = d[o + 1] / 255, b = d[o + 2] / 255;
        const l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        sr += r * l; sg += g * l; sb += b * l; sl += l; lm += l;
        const p = l * l * l; cxl += i * p; cyl += j * p; poids += p; vr += r * p; vg += g * p; vb += b * p;
        if (j < 6 && (i < 10 || i >= 20)) { lt += l; nt++; }   // le haut à gauche et à droite, là où on écrit
      }
      lm /= CW * CH; lt /= nt;
      // fond clair (brume, encre grise) : on écrit à l'encre noire ; fond sombre : à la craie
      if (!clair && lt > 0.56) clair = true; else if (clair && lt < 0.46) clair = false;
      ELT.pile.classList.toggle("clair", clair);
      if (reglages.scene !== "graphite") {
        const m = Math.max(sr, sg, sb) || 1;
        const tr = sr / m, tg = sg / m, tb = sb / m;           // couleur de la lumière
        const fort = Math.min(1, 0.66 + lm * 0.75);             // une scène sombre éclaire un peu moins la feuille
        const teinte = 0.32;
        R = fort * (1 - teinte * (1 - tr)); G = fort * (1 - teinte * (1 - tg)); B = fort * (1 - teinte * (1 - tb));
        const lx = (cxl / (poids || 1) + 0.5) / CW * innerWidth, ly = (cyl / (poids || 1) + 0.5) / CH * innerHeight;
        ang = Math.atan2(lx - innerWidth / 2, -(ly - innerHeight * 0.6)) * 180 / Math.PI;
        // l'ombre part à l'opposé de la lumière
        const vx = innerWidth / 2 - lx, vy = innerHeight * 0.6 - ly, nv = Math.hypot(vx, vy) || 1;
        cibleOmbre = [vx / nv * 0.8, Math.max(0.35, vy / nv * 0.8 + 0.4)];
        ecart = 0.12 + Math.min(0.12, (0.5 - Math.min(0.5, lm)) * 0.26);
        const pv = poids || 1; reflet = `rgba(${Math.min(255, vr / pv * 290) | 0},${Math.min(255, vg / pv * 290) | 0},${Math.min(255, vb / pv * 290) | 0},${(0.12 + Math.min(0.12, lm * 0.4)).toFixed(3)})`;
      } else cibleOmbre = [0.25, 1];
    } catch (_) {}
    cible = [R, G, B];
    ombrage = `linear-gradient(${ang | 0}deg, rgba(0,0,0,${ecart.toFixed(3)}), rgba(0,0,0,0) 55%, ${reflet})`;
  };
  // la couleur de la lumière glisse doucement vers celle du décor : un voile posé sur le papier
  // (papier × lumière = voile de couleur c à l'opacité a, en mélange normal)
  let cible = [0.97, 0.97, 0.97], jour = [0, 0, 0], ombrage = "linear-gradient(rgba(0,0,0,0),rgba(0,0,0,0))";
  let cibleOmbre = [0, 1], ombreAct = [0, 1];
  const glisser = () => {
    if (vue !== "pile") return;
    for (let k = 0; k < 3; k++) jour[k] += (cible[k] - jour[k]) * (jour[k] === 0 ? 1 : 0.12);
    for (let k = 0; k < 2; k++) ombreAct[k] += (cibleOmbre[k] - ombreAct[k]) * 0.08;
    ELT.pile.style.setProperty("--ox", ombreAct[0].toFixed(3));
    ELT.pile.style.setProperty("--oy", ombreAct[1].toFixed(3));
    const pap = PAPIER, a = Math.max(0.02, Math.min(0.6, 1 - Math.min(...jour) * 0.94));
    const c = [0, 1, 2].map(k => Math.max(0, Math.min(255, (pap[k] * jour[k] - pap[k] * (1 - a)) / a)) | 0);
    dernierJour = `${ombrage}, linear-gradient(rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)}),rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)}))`;
    for (const l of ELT.contenu.querySelectorAll(".lumiere")) l.style.background = dernierJour;
  };
  setInterval(regarder, 400);
  setInterval(glisser, 100);
}

// ---------- la tablette penche : le décor glisse derrière les feuilles ----------
{
  const D = document.getElementById("decor");
  let ref = null, but = [0, 0], pos = [0, 0], tourne = false;
  addEventListener("deviceorientation", e => {
    if (e.beta == null || e.gamma == null) return;
    const an = ((screen.orientation && screen.orientation.angle) || 0) * Math.PI / 180;
    const gx = e.gamma * Math.cos(an) + e.beta * Math.sin(an), gy = -e.gamma * Math.sin(an) + e.beta * Math.cos(an);
    if (!ref) ref = [gx, gy];
    ref[0] += (gx - ref[0]) * 0.004; ref[1] += (gy - ref[1]) * 0.004;   // la position de repos suit la main, lentement
    const bo = v => Math.max(-1, Math.min(1, v));
    but = [bo((gx - ref[0]) / 18), bo((gy - ref[1]) / 18)];
    if (!tourne) { tourne = true; requestAnimationFrame(pas); }
  });
  function pas() {
    if (vue !== "pile") { tourne = false; return; }
    pos[0] += (but[0] - pos[0]) * 0.09; pos[1] += (but[1] - pos[1]) * 0.09;
    D.style.transform = `translate3d(${(-pos[0] * 20).toFixed(2)}px,${(-pos[1] * 20).toFixed(2)}px,0) scale(1.03)`;
    ELT.contenu.style.transform = `translate3d(${(pos[0] * 6).toFixed(2)}px,${(pos[1] * 6).toFixed(2)}px,0)`;
    if (Math.abs(but[0] - pos[0]) + Math.abs(but[1] - pos[1]) < 0.002) { tourne = false; return; }
    requestAnimationFrame(pas);
  }
}

// ---------- passer de la pile à la feuille, et retour ----------
let enMouvement = false;
function envol(src, depuis, vers, fini) {
  const im = document.createElement("img");
  im.className = "envol"; im.src = src;
  const pose = r => `translate(${r.x}px,${r.y}px) rotate(${r.a || 0}deg) scale(${r.w / 100},${r.h / 100})`;
  im.style.width = "100px"; im.style.height = "100px";
  im.style.transform = pose(depuis);
  document.body.appendChild(im);
  im.getBoundingClientRect();
  requestAnimationFrame(() => { im.style.transform = pose(vers); });
  let fait = false;
  const fin = () => { if (fait) return; fait = true; fini(); requestAnimationFrame(() => im.remove()); };
  im.addEventListener("transitionend", fin);
  setTimeout(fin, 520);
}
function rectCarte(el) {
  const a = +el.dataset.angle || 0, w = el.offsetWidth, h = el.offsetHeight;
  const rc = el.getBoundingClientRect();
  // la feuille est couchée : on part de ce qu'on en voit à l'écran
  if (INCLINE) return { x: rc.left, y: rc.top, w: rc.width, h: rc.height, a: 0 };
  // coin haut-gauche de la carte tournée autour de son centre
  const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2, t = a * Math.PI / 180;
  return { x: cx - (w / 2) * Math.cos(t) + (h / 2) * Math.sin(t), y: cy - (w / 2) * Math.sin(t) - (h / 2) * Math.cos(t), w, h, a };
}
async function ouvrir(el) {
  if (enMouvement) return;
  enMouvement = true;
  const id = el.dataset.id;
  const src = el.querySelector(".vue").src;
  const depuis = rectCarte(el);
  F.G.fill(0); F.I.fill(0);
  histo.length = 0;
  tissu = new Float32Array(TS * TS);
  modifie = false;
  let rec = null;
  if (id === "nouvelle") courant = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), cree: Date.now(), nom: "", carnet: reglages.carnet !== "tout" ? reglages.carnet : "", temps: 0 };
  else {
    rec = await lireDessin(id);
    courant = { id, cree: rec ? rec.cree : Date.now(), nom: rec && rec.nom || "", carnet: rec && rec.carnet || "", temps: rec && rec.temps || 0 };
    if (rec) { try { await chargerDans(rec, F.G, F.I, F.S); } catch (_) {} }
  }
  const vers = { x: 0, y: 0, w: rec ? rec.w / (rec.dpr || DPR) : F.limX / DPR, h: rec ? rec.h / (rec.dpr || DPR) : F.ch / DPR, a: 0 };
  envol(src, depuis, vers, () => {
    vue = "feuille";
    AMB.arreter();
    ELT.dessin.classList.remove("cache");
    ELT.pile.classList.add("cache");
    dimensionnerTout();
    composer(F, 0, 0, F.cw - 1, F.ch - 1);
    dessinerMarge();
    enMouvement = false;
  });
}
async function allerPile() {
  if (enMouvement) return;
  enMouvement = true;
  if (modifie) await sauver_(); else if (sauveEnCours) await sauveEnCours;
  const src = await new Promise(res => vignette(F.cv, F.limX, F.ch).then(b => res(URL.createObjectURL(b))));
  vue = "pile";
  ELT.pile.classList.remove("cache");
  appliquerAmbiance();
  await remplirPile(false, courant && courant.id);
  const el = courant && ELT.contenu.querySelector(`[data-id="${courant.id}"]`);
  const vers = el ? rectCarte(el) : { x: innerWidth / 2, y: innerHeight / 2, w: 1, h: 1, a: 0 };
  if (el) el.style.visibility = "hidden";
  ELT.dessin.classList.add("cache");
  envol(src, { x: 0, y: 0, w: F.limX / DPR, h: F.ch / DPR, a: 0 }, vers, () => {
    if (el) el.style.visibility = "";
    URL.revokeObjectURL(src);
    enMouvement = false;
  });
}

// le temps passé à dessiner : compté tant que le crayon bouge (une pause de plus de 4 s ne compte pas)
{
  let dernier = 0;
  const compter = e => {
    if (e.pointerType === "touch" || !courant) return;
    const t = performance.now();
    if (dernier && t - dernier < 4000) courant.temps = (courant.temps || 0) + (t - dernier);
    dernier = t;
  };
  ELT.dessin.addEventListener("pointerdown", compter, true);
  ELT.dessin.addEventListener("pointermove", compter, true);
}
addEventListener("resize", dimensionnerTout);
if (window.ResizeObserver) new ResizeObserver(dimensionnerTout).observe(document.body);
dimensionnerTout();
appliquerAmbiance();
remplirPile(true);
window.__feuille = { choisir, dessinerMarge, F, M };
})();
</script>
