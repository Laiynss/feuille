<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Feuille</title>
<style>
/* La feuille, sa marge où les outils sont posés, et la pile de dessins. Tout ce qu'on voit est tracé avec les outils de l'app. */
:root{
  --papier:#f4f3ef;
  --fond:#6d6e72;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--fond);overflow:hidden;overscroll-behavior:none}
body{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block}
#dessin{position:fixed;inset:0;background:var(--papier)}
#dessin canvas{position:absolute;top:0;touch-action:none;background:var(--papier)}
#feuille{left:0;width:100%;height:100%}
#marge{right:0;width:84px;height:100%}
#pile{position:fixed;inset:0;background:var(--fond)}
#fond{position:absolute;inset:0;width:100%;height:100%}
#ciel,#ciel2,#affiche{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity 1.2s ease}
#ciel,#ciel2{opacity:0}
#ciel.pret,#ciel2.pret{opacity:1}
#affiche.cache-doux,#ciel.cache-doux{opacity:0}
#cartes{position:absolute;inset:0;overflow:hidden;touch-action:none}
#cartes .contenu{position:absolute;inset:0;perspective:1100px;perspective-origin:40% -20%}
.carte{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform;isolation:isolate;background:var(--papier);box-sizing:border-box;border-bottom:1.5px solid #c9c4b9;
  transition:transform .5s cubic-bezier(.2,.75,.25,1),opacity .5s,box-shadow .5s;
  box-shadow:0 .5px 1px rgba(0,0,0,.35),0 3px 9px rgba(0,0,0,.28),0 14px 34px rgba(0,0,0,.22)}
.carte.levee{box-shadow:0 1px 2px rgba(0,0,0,.3),0 10px 22px rgba(0,0,0,.3),0 30px 60px rgba(0,0,0,.3)}
.carte .vue{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.carte .lumiere{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 1px rgba(0,0,0,.25),inset 0 0 22px rgba(40,35,30,.1)}
.carte .lumiere::after{content:"";position:absolute;inset:0;background:rgba(22,20,18,var(--fonce,0));transition:background .5s}
.carte .marques{position:absolute;right:4px;bottom:4px;pointer-events:none}
.envol{position:fixed;left:0;top:0;transform-origin:0 0;pointer-events:none;z-index:5;transition:transform .32s cubic-bezier(.3,.6,.2,1)}
.cache{display:none !important}
#instant{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity 1s ease}
</style>

<div id="dessin" class="cache">
  <canvas id="feuille" aria-label="Feuille de dessin"></canvas>
  <canvas id="marge" aria-label="Outils"></canvas>
</div>
<div id="pile">
  <canvas id="fond" aria-hidden="true"></canvas>
  <img id="affiche" alt="" aria-hidden="true">
  <video id="ciel" muted playsinline preload="auto" aria-hidden="true"></video>
  <video id="ciel2" muted playsinline loop preload="auto" aria-hidden="true"></video>
  <div id="cartes"><div class="contenu"></div></div>
</div>

<script>
// Fonds de la pile : des plans tirés des œuvres (Edgerunners, Tokyo Ghoul, Shanghai…), montés en boucle.
// Chaque fond est dans fonds/rendu/<nom>/ : affiche.jpg, carte.jpg, info.json et la vidéo VP9 en morceaux m0.webm, m1.webm…
// La vidéo démarre dès les premiers morceaux reçus (MediaSource) ; une fois tout reçu, un second lecteur prend le
// fichier entier en boucle et prend la relève à la fin du premier passage, sans coupure.
(() => {
  const FONDS = [
    { n: "lune", titre: "Edgerunners" },
    { n: "ghoul", titre: "Tokyo Ghoul" },
    { n: "herding", titre: "Tales of Herding Gods" },
    { n: "shanghai", titre: "Shanghai" },
    { n: "sekiro", titre: "Sekiro" },
    { n: "graphite", titre: "Graphite" },
  ];
  const TYPE = 'video/webm; codecs="vp9"';
  const FLUX = !!(window.MediaSource && MediaSource.isTypeSupported(TYPE));
  const dl = {};                // nom -> { morceaux: [promesse ArrayBuffer], entier: promesse d'URL }
  function telecharger(n) {
    if (!dl[n]) dl[n] = (async () => {
      const r = await fetch(`fonds/rendu/${n}/info.json`); if (!r.ok) throw new Error(r.status);
      const info = await r.json();
      const morceaux = Array.from({ length: info.morceaux }, (_, k) =>
        fetch(`fonds/rendu/${n}/m${k}.webm`).then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }));
      const entier = Promise.all(morceaux).then(b => URL.createObjectURL(new Blob(b, { type: "video/webm" })));
      entier.catch(() => {});
      return { morceaux, entier };
    })().catch(e => { delete dl[n]; throw e; });
    return dl[n];
  }
  function vider(v) {
    v.onended = v.oncanplay = null; v.pause();
    if (v.dataset.flux) { URL.revokeObjectURL(v.dataset.flux); delete v.dataset.flux; }
    v.removeAttribute("src"); v.load();
    v.style.transition = ""; v.classList.remove("pret");
  }
  function creer(A, B, affiche) {
    let actuel = null, actif = false, gen = 0, visible = null;
    for (const v of [A, B]) { v.muted = true; v.defaultMuted = true; }
    const montrer = (v, doux) => {
      v.style.transition = doux ? "" : "none";
      v.classList.add("pret"); visible = v;
      if (actif) v.play().catch(() => {});
    };
    async function lancer(n, g) {
      const d = await telecharger(n);
      if (g !== gen) return;
      if (!FLUX) {                                   // sans MediaSource : on attend le fichier entier
        const url = await d.entier; if (g !== gen) return;
        A.loop = true; A.src = url;
        A.oncanplay = () => { A.oncanplay = null; if (g === gen) montrer(A, true); };
        return;
      }
      const ms = new MediaSource(), u = URL.createObjectURL(ms);
      A.loop = false; A.dataset.flux = u; A.src = u;
      A.oncanplay = () => { A.oncanplay = null; if (g === gen) montrer(A, true); };
      ms.addEventListener("sourceopen", async () => {
        try {
          const sb = ms.addSourceBuffer(TYPE);
          for (const p of d.morceaux) {
            const buf = await p; if (g !== gen) return;
            await new Promise((ok, ko) => { sb.addEventListener("updateend", ok, { once: true }); sb.addEventListener("error", ko, { once: true }); sb.appendBuffer(buf); });
          }
          if (g === gen && ms.readyState === "open") ms.endOfStream();
        } catch (e) { window.__erreurFond = String(e); }
      }, { once: true });
      // relève : le second lecteur prend le fichier entier, en boucle, prêt sur sa première image
      const url = await d.entier; if (g !== gen) return;
      B.loop = true; B.preload = "auto"; B.src = url;
      await new Promise(ok => { if (B.readyState >= 3) ok(); else B.addEventListener("canplaythrough", ok, { once: true }); });
      if (g !== gen) return;
      const relais = () => {
        if (g !== gen) return;
        B.currentTime = 0; montrer(B, false);
        requestAnimationFrame(() => requestAnimationFrame(() => { if (g === gen) vider(A); }));
      };
      if (A.ended) relais(); else A.onended = relais;
    }
    function choisir(n) {
      if (n === actuel) return;
      actuel = n; const g = ++gen;
      vider(A); vider(B); visible = null;
      if (n === "graphite") { affiche.style.display = "none"; A.style.display = B.style.display = "none"; return; }
      affiche.style.display = ""; A.style.display = B.style.display = "";
      affiche.src = `fonds/rendu/${n}/affiche.jpg`;
      lancer(n, g).catch(e => { window.__erreurFond = String(e); });
    }
    return {
      choisir,
      demarrer() { actif = true; if (visible) visible.play().catch(() => {}); },
      arreter() { actif = false; A.pause(); B.pause(); },
      redimensionner() {},
      carte: n => `fonds/rendu/${n}/carte.jpg`,
    };
  }
  window.__ambiance = { creer, NOMS: FONDS.map(f => f.n), FONDS };
})();
</script>
<script>
(() => {
"use strict";
const DPR = Math.min(window.devicePixelRatio || 1, 3);
const MM = 4.8 * DPR;          // pixels écran par millimètre sur la tablette
const MARGE = 84;              // largeur de la marge, en px CSS

// ---------- grain du papier ----------
const GR = new Float32Array(512 * 512);
(function grain() {
  const T = 512;
  let graine = 12345;
  const alea = () => ((graine = (graine * 1664525 + 1013904223) >>> 0) / 4294967296);
  function couche(cx, cy) {
    const L = new Float32Array(cx * cy);
    for (let i = 0; i < L.length; i++) L[i] = alea();
    const out = new Float32Array(T * T);
    for (let y = 0; y < T; y++) {
      const fy = y * cy / T, y0 = fy | 0, ty = fy - y0, sy = ty * ty * (3 - 2 * ty), y1 = (y0 + 1) % cy;
      for (let x = 0; x < T; x++) {
        const fx = x * cx / T, x0 = fx | 0, tx = fx - x0, sx = tx * tx * (3 - 2 * tx), x1 = (x0 + 1) % cx;
        const a = L[y0 * cx + x0], b = L[y0 * cx + x1], c = L[y1 * cx + x0], d = L[y1 * cx + x1];
        const h0 = a + (b - a) * sx, h1 = c + (d - c) * sx;
        out[y * T + x] = h0 + (h1 - h0) * sy;
      }
    }
    return out;
  }
  // le grain d'un papier à dessin : des creux de 0,2 à 0,6 mm, doux, rien au pixel près
  const k = Math.max(1, MM / 9.6);
  const n = c => Math.max(8, Math.round(c / k / 8) * 8);
  const parts = [
    [couche(n(232), n(232)), 0.46], [couche(n(136), n(136)), 0.26], [couche(n(56), n(56)), 0.10],
    [couche(24, 24), 0.08], [couche(24, n(160)), 0.05], [couche(n(160), 24), 0.05],
  ];
  for (let i = 0; i < GR.length; i++) { let s = 0; for (const [c, w] of parts) s += c[i] * w; GR[i] = s; }
  const tri = Array.from({ length: GR.length }, (_, i) => i).sort((a, b) => GR[a] - GR[b]);
  for (let r = 0; r < tri.length; r++) GR[tri[r]] = r / (tri.length - 1);
})();
const grainEn = (x, y) => GR[((y & 511) << 9) | (x & 511)];

// ---------- couleurs ----------
const PAPIER = [244, 243, 239], MINE = [50, 52, 58], ENCRE = [19, 19, 23];
const GMAX = 3, LUT_N = 2048, LUT_K = LUT_N / GMAX, LUT = new Float32Array(LUT_N + 1);
for (let i = 0; i <= LUT_N; i++) LUT[i] = 0.86 * (1 - Math.exp(-(i / LUT_K) * 0.95));

// ---------- une feuille (graphite + encre + affichage) ----------
function creerFeuille(cv, taille) {
  return {
    cv, ctx: cv.getContext("2d", { desynchronized: true, alpha: false }),
    S: taille, G: new Float32Array(taille * taille), I: new Float32Array(taille * taille),
    cw: 0, ch: 0, img: null, d32: null, ox: 0, limX: 1e9,
    sx0: Infinity, sy0: Infinity, sx1: -1, sy1: -1, enreg: null,
  };
}
function assurer(F, n) {
  if (n <= F.S) return;
  const N = n + 64, G2 = new Float32Array(N * N), I2 = new Float32Array(N * N);
  for (let y = 0; y < F.S; y++) {
    G2.set(F.G.subarray(y * F.S, y * F.S + F.S), y * N);
    I2.set(F.I.subarray(y * F.S, y * F.S + F.S), y * N);
  }
  F.S = N; F.G = G2; F.I = I2;
}
function sale(F, x0, y0, x1, y1) {
  if (x0 < F.sx0) F.sx0 = x0; if (y0 < F.sy0) F.sy0 = y0;
  if (x1 > F.sx1) F.sx1 = x1; if (y1 > F.sy1) F.sy1 = y1;
}
function boite(F, cx, cy, r) {
  return [Math.max(0, Math.floor(cx - r - 1)), Math.max(0, Math.floor(cy - r - 1)),
          Math.min(F.S - 1, F.limX - 1, Math.ceil(cx + r + 1)), Math.min(F.S - 1, Math.ceil(cy + r + 1))];
}
function composer(F, x0, y0, x1, y1) {
  x0 = Math.max(0, x0); y0 = Math.max(0, y0);
  x1 = Math.min(F.cw - 1, x1, F.S - 1); y1 = Math.min(F.ch - 1, y1, F.S - 1);
  if (x1 < x0 || y1 < y0) return;
  const { G, I, S, d32, cw, ox } = F;
  for (let y = y0; y <= y1; y++) {
    const row = y * S, out = y * cw;
    for (let x = x0; x <= x1; x++) {
      const i = row + x;
      const pa = 1 - 0.028 * (1 - grainEn(x + ox, y));
      let r = PAPIER[0] * pa, g = PAPIER[1] * pa, b = PAPIER[2] * pa;
      const gm = G[i];
      if (gm > 0.0005) {
        let k = (gm * LUT_K) | 0; if (k > LUT_N) k = LUT_N;
        const dg = LUT[k];
        r += (MINE[0] - r) * dg; g += (MINE[1] - g) * dg; b += (MINE[2] - b) * dg;
      }
      const e = I[i];
      if (e > 0) { r += (ENCRE[0] - r) * e; g += (ENCRE[1] - g) * e; b += (ENCRE[2] - b) * e; }
      d32[out + x] = 0xff000000 | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0);
    }
  }
  F.ctx.putImageData(F.img, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
}
function montrer(F) {
  if (F.sx1 < 0) return;
  composer(F, F.sx0, F.sy0, F.sx1, F.sy1);
  F.sx0 = F.sy0 = Infinity; F.sx1 = F.sy1 = -1;
}
function dimensionner(F, w, h) {
  assurer(F, Math.max(w, h));
  F.cw = w; F.ch = h;
  F.cv.width = w; F.cv.height = h;
  F.img = F.ctx.createImageData(w, h);
  F.d32 = new Uint32Array(F.img.data.buffer);
}

// ---------- retour en arrière : on garde les morceaux de feuille avant chaque trait ----------
const TU = 64;
function sauver(F, x0, y0, x1, y1) {
  const E = F.enreg;
  if (!E) return;
  const S = F.S;
  for (let ty = (y0 / TU) | 0; ty <= ((y1 / TU) | 0); ty++) {
    for (let tx = (x0 / TU) | 0; tx <= ((x1 / TU) | 0); tx++) {
      const k = ty * 65536 + tx;
      if (E.has(k)) continue;
      const bx = tx * TU, by = ty * TU, w = Math.min(TU, S - bx), h = Math.min(TU, S - by);
      if (w <= 0 || h <= 0) continue;
      const g = new Float32Array(w * h), i = new Float32Array(w * h);
      for (let y = 0; y < h; y++) {
        const o = (by + y) * S + bx;
        g.set(F.G.subarray(o, o + w), y * w);
        i.set(F.I.subarray(o, o + w), y * w);
      }
      E.set(k, { bx, by, w, h, g, i });
    }
  }
}

// ---------- les outils ----------
const OUTILS = {
  crayon:    { sorte: "mine", R: 3.2,  Rp: 0.25, bord: 0.45, d0: 0.16, dp: 0.74, flux: 1.3, ec: 0.12, pexp: 1.6 },
  criterium: { sorte: "mine", R: 0.27, Rp: 0.20, bord: 0,    d0: 0.42, dp: 0.45, flux: 0.95, ec: 0.25, pexp: 1.2 },
  feutre:    { sorte: "encre", R: 0.30, ec: 0.2 }, // pointe fine qui s'écrase quand on appuie
  mouchoir:  { sorte: "mouchoir", R: 7.0, Rp: 0.15, ec: 0.16, prend: 0.12, rend: 0.07, garde: 0.004, lisse: 0.35 },
  // la mie : sa largeur vient de l'appui (rayon R0 + R1·p^1.5 en mm)
  mie:       { sorte: "mie", R0: 0.45, R1: 5.6, ec: 0.14, leve: 0.86 },
  gomme:     { sorte: "gomme", R: 2.5, Rp: 0, ec: 0.15 },
};
const TAILLES_GOMME = [2, 5, 10, 20]; // diamètre en mm
let tailleGomme = 1;
const rayon = (t, p) => t.sorte === "gomme" ? Math.max(0.8, TAILLES_GOMME[tailleGomme] / 2 * MM)
  : t.sorte === "encre" ? Math.max(0.8, MM * t.R * (0.55 + 1.1 * p * p))
  : t.sorte === "mie" ? Math.max(0.8, MM * (t.R0 + t.R1 * Math.pow(p, 1.5)))
  : Math.max(0.8, t.R * MM * (1 - t.Rp / 2 + t.Rp * p));

// le mouchoir : un carré de tissu qui porte son graphite, collé sous le doigt
const TR = Math.ceil(1.12 * OUTILS.mouchoir.R * MM) + 2, TS = 2 * TR + 1;
let tissu = new Float32Array(TS * TS); // reste sale d'un trait à l'autre
const espacement = (t, r) => Math.max(0.5, t.ec * 2 * r);

function touchMine(F, t, cx, cy, r, p, pas) {
  const [x0, y0, x1, y1] = boite(F, cx, cy, r);
  if (x1 < x0) return;
  sauver(F, x0, y0, x1, y1);
  const doux = t.bord > 0 ? t.bord * r : 0.8;
  const debit = t.flux * (pas / (2 * r)) * (0.15 + 2.2 * Math.pow(p, t.pexp));
  const prof = t.d0 + t.dp * p;
  const { G, S, ox } = F;
  // le plat d'une mine couchée n'est pas lisse : ses arêtes laissent des stries dans le sens du trait
  const strie = t.bord > 0, icx = Math.round(cx), icy = Math.round(cy);
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy, row = y * S;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx;
      let m = (r - Math.sqrt(dx * dx + dy * dy)) / doux;
      if (m <= 0) continue;
      if (m > 1) m = 1;
      const i = row + x, g = G[i];
      const pr = prof + 0.28 * (g < 2 ? g : 2) / 2;
      // contact doux : la mine touche les bosses, puis descend dans les creux quand on appuie
      let c = (grainEn(x + ox, y) - (1 - pr)) / 0.7 + 0.25;
      c = c < 0 ? 0 : c > 1 ? 1 : c;
      c = 0.3 + 0.7 * c * c * (3 - 2 * c);
      const lt = strie ? GR[((((y - icy) >> 1) + 300 & 511) << 9) | (((x - icx) >> 1) + 300 & 511)] : 0;
      const mine = strie ? 0.25 + 2.25 * lt * lt : 1;
      G[i] = g + debit * m * c * mine * (1 - g / GMAX);
    }
  }
  sale(F, x0, y0, x1, y1);
}
function touchEncre(F, cx, cy, r, sec) {
  const [x0, y0, x1, y1] = boite(F, cx, cy, r + 1);
  if (x1 < x0) return;
  sauver(F, x0, y0, x1, y1);
  const { I, S, ox } = F;
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy, row = y * S;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx;
      const h = grainEn(x + ox, y);
      let m = (r - Math.sqrt(dx * dx + dy * dy)) / 0.7 + 0.5 + (h - 0.5) * 0.55;
      if (m <= 0) continue;
      if (m > 1) m = 1;
      if (sec > 0) m *= 1 - sec * (1 - h);
      const i = row + x;
      if (m > I[i]) I[i] = m;
    }
  }
  sale(F, x0, y0, x1, y1);
}
function touchMie(F, t, cx, cy, r, p, pas) {
  const [x0, y0, x1, y1] = boite(F, cx, cy, r);
  if (x1 < x0) return;
  sauver(F, x0, y0, x1, y1);
  // ce qu'un passage enlève au centre, réparti sur les touches qui se recouvrent
  const T = t.leve * (0.7 + 0.3 * p);
  const n = 1.3 * pas / (2 * r);
  const doux = 0.4 * r + 1;
  const { G, S, ox } = F;
  // le plat d'une mine couchée n'est pas lisse : ses arêtes laissent des stries dans le sens du trait
  const strie = t.bord > 0, icx = Math.round(cx), icy = Math.round(cy);
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy, row = y * S;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx;
      let m = (r - Math.sqrt(dx * dx + dy * dy)) / doux;
      if (m <= 0) continue;
      if (m > 1) m = 1;
      const i = row + x;
      if (G[i] < 0.0005) continue;
      // la mie prend sur les bosses du papier, le creux garde un voile
      let l = T * m * (0.8 + 0.4 * grainEn(x + ox, y));
      if (l > 0.97) l = 0.97;
      G[i] *= Math.pow(1 - l, n);
    }
  }
  sale(F, x0, y0, x1, y1);
}
function touchGomme(F, cx, cy, r) {
  const [x0, y0, x1, y1] = boite(F, cx, cy, r);
  if (x1 < x0) return;
  sauver(F, x0, y0, x1, y1);
  const { G, I, S } = F;
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy, row = y * S;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx;
      let m = r + 0.5 - Math.sqrt(dx * dx + dy * dy);
      if (m <= 0) continue;
      if (m > 1) m = 1;
      const i = row + x;
      G[i] *= 1 - m; I[i] *= 1 - m;
    }
  }
  sale(F, x0, y0, x1, y1);
}
function touchMouchoir(F, t, cx, cy, r, p, st) {
  let [x0, y0, x1, y1] = boite(F, cx, cy, r);
  x0 = Math.max(1, x0); y0 = Math.max(1, y0); x1 = Math.min(F.S - 2, x1); y1 = Math.min(F.S - 2, y1);
  if (x1 < x0) return;
  sauver(F, x0, y0, x1, y1);
  const T = st && st.tissu ? st.tissu : (tissu);
  const { G, S, ox } = F;
  const s0 = 0.35 + 0.65 * p;
  const icx = Math.round(cx), icy = Math.round(cy);
  for (let y = y0; y <= y1; y++) {
    const dy = y + 0.5 - cy, row = y * S, v = y - icy + TR;
    if (v < 0 || v >= TS) continue;
    for (let x = x0; x <= x1; x++) {
      const dx = x + 0.5 - cx, q = (dx * dx + dy * dy) / (r * r);
      if (q >= 1) continue;
      const u = x - icx + TR;
      if (u < 0 || u >= TS) continue;
      const s = s0 * (1 - q);
      // la trame du tissu (elle se déplace avec le doigt : elle laisse des traînées dans le sens du geste)
      const fb = GR[(((v * 5) & 511) << 9) | ((u * 5 + 131) & 511)];
      const gr = grainEn(x + ox, y);
      const i = row + x, g = G[i], ti = v * TS + u, tv = T[ti];
      const prend = t.prend * s * (0.4 + 1.2 * fb) * (0.7 + 0.6 * gr) * g;
      const rend = t.rend * s * (0.4 + 1.2 * fb) * tv;
      // le frottement pousse le graphite dans les creux du papier
      const voisins = (G[i - 1] + G[i + 1] + G[i - S] + G[i + S]) * 0.25;
      G[i] = g - prend + rend + (voisins - g) * t.lisse * s;
      T[ti] = (tv + prend - rend) * (1 - t.garde * s);
    }
  }
  sale(F, x0, y0, x1, y1);
}
// un contact de l'outil ; renvoie l'espacement jusqu'au suivant
function touche(F, cle, x, y, p, k, ddx, ddy, vitesse, st) {
  const t = OUTILS[cle];
  const r = rayon(t, p) * k;
  const pas = espacement(t, r);
  if (t.sorte === "mine") touchMine(F, t, x, y, r, p, pas);
  else if (t.sorte === "encre") touchEncre(F, x, y, r, Math.min(0.25, Math.max(0, (vitesse / MM - 0.8) / 2)));
  else if (t.sorte === "mie") touchMie(F, t, x, y, r, p, pas);
  else if (t.sorte === "gomme") touchGomme(F, x, y, r);
  else touchMouchoir(F, t, x, y, r, p, st);
  return pas;
}
// fait avancer un trait jusqu'au point suivant
function avancer(F, s, cle, nx, ny, np, k) {
  const dx = nx - s.x, dy = ny - s.y, dist = Math.hypot(dx, dy);
  if (dist < 0.01) { s.p = np; return; }
  const ux = dx / dist, uy = dy / dist;
  const t = OUTILS[cle];
  let suivant = s.reste, garde = 0;
  while (suivant <= dist && garde++ < 4000) {
    const f = suivant / dist, p = s.p + (np - s.p) * f;
    const pas = espacement(t, rayon(t, p) * k);
    touche(F, cle, s.x + dx * f, s.y + dy * f, p, k, ux * pas, uy * pas, s.v, s);
    suivant += pas;
  }
  s.reste = suivant - dist;
  s.x = nx; s.y = ny; s.p = np;
}
// trait tracé par l'appli elle-même (pour la marge), points en px CSS
function tracer(F, cle, pts, k = 1) {
  const [x, y, p] = pts[0];
  const e = F.echelle || DPR;
  const s = { x: x * e, y: y * e, p, v: 0, reste: 0, tissu: new Float32Array(TS * TS) };
  if (OUTILS[cle].sorte !== "mouchoir") s.reste = touche(F, cle, s.x, s.y, p, k, 0, 0, 0);
  for (let i = 1; i < pts.length; i++) avancer(F, s, cle, pts[i][0] * e, pts[i][1] * e, pts[i][2], k);
}

// T : repère d'un objet (centre, angle) ; x le long de l'objet, y en travers ; tout en px CSS
function repere(cx, cy, a, ech = 1) {
  const c = Math.cos(a) * ech, s = Math.sin(a) * ech;
  return (x, y, p = 0.5) => [cx + x * c - y * s, cy + x * s + y * c, p];

let tremble = 1;
const main = () => ((tremble = (tremble * 16807) % 2147483647) / 2147483647 - 0.5);
// un trait à la main : on découpe en petits pas et on laisse trembler un peu
function tr(F, cle, T, pts, k = 1, mou = 0.18) {
  const out = [];
  for (let i = 0; i < pts.length; i++) {
    const [x, y, p] = pts[i];
    if (i > 0) {
      const [x0, y0, p0] = pts[i - 1];
      const n = Math.max(1, Math.ceil(Math.hypot(x - x0, y - y0) / 1.5));
      for (let j = 1; j < n; j++) { const t = j / n; out.push(T(x0 + (x - x0) * t + main() * mou, y0 + (y - y0) * t + main() * mou, p0 + (p - p0) * t)); }
    }
    out.push(T(x + main() * mou, y + main() * mou, p));
  }
  tracer(F, cle, out, k);
}
// courbe passant par des points (Catmull-Rom)
function lisse(pts, ferme = false, n = 8) {
  const out = [], m = pts.length;
  const P = i => ferme ? pts[(i + m) % m] : pts[Math.max(0, Math.min(m - 1, i))];
  const fin = ferme ? m : m - 1;
  for (let i = 0; i < fin; i++) {
    const a = P(i - 1), b = P(i), c = P(i + 1), d = P(i + 2);
    for (let j = 0; j < n; j++) {
      const t = j / n, t2 = t * t, t3 = t2 * t;
      const f = (u, v, w, z) => 0.5 * (2 * v + (-u + w) * t + (2 * u - 5 * v + 4 * w - z) * t2 + (-u + 3 * v - 3 * w + z) * t3);
      out.push([f(a[0], b[0], c[0], d[0]), f(a[1], b[1], c[1], d[1]), b[2] + (c[2] - b[2]) * t]);
    }
  }
  out.push(ferme ? [...pts[0]] : [...pts[m - 1]]);
  return out;
}
// remplir une bande au crayon couché (va-et-vient en travers, en avançant le long)
function hachure(F, T, x0, x1, haut, bas, p, k, pas = 1.2) {
  const pts = [];
  let sens = 0;
  for (let x = x0; x <= x1 + 0.01; x += pas) { pts.push([x, sens ? bas(x) : haut(x), p]); sens ^= 1; }
  tr(F, "crayon", T, pts, k, 0.1);
}
function estompe(F, T, pts, k) { tr(F, "mouchoir", T, pts, k, 0.3); }
function gommerT(F, T, pts, r) {
  const e = F.echelle || DPR;
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = T(pts[i - 1][0], pts[i - 1][1]), [bx, by] = T(pts[i][0], pts[i][1]);
    const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 0.5));
    for (let j = 0; j <= n; j++) touchGomme(F, (ax + (bx - ax) * j / n) * e, (ay + (by - ay) * j / n) * e, r * e);
  }
}
// ombre d'un objet posé ou soulevé : du graphite estompé sous sa silhouette
function ombre(F, T, x0, x1, hw, force, flou) {
  hachure(F, T, x0, x1, () => -hw * 0.7, () => hw * 0.7, force, 0.1, 0.9);

    estompe(F, T, j % 2 ? pts.reverse() : pts, k);
  }
}

let courant = null;      // { id, cree }

function base() {
  if (!baseP) baseP = new Promise(res => {
    try {
      const r = indexedDB.open("feuille", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("dessins", { keyPath: "id" });

      r = fn(tx.objectStore("dessins"));

}

}
async function sauver_() {

  if (sauveEnCours) { await sauveEnCours; return sauver_(); }
  modifie = false;

let fondFait = "";
function dessinerFond() {
  const W = innerWidth, H = innerHeight, cle = W + "x" + H;
  if (fondFait === cle) return;
  fondFait = cle;
  const P = feuilleLibre(W, H, 1);
  P.cv = ELT.fond; P.ctx = ELT.fond.getContext("2d", { alpha: false });
  P.cw = W; P.ch = H; P.cv.width = W; P.cv.height = H;

  const k = f => f / DPR;
  const I = repere(0, 0, 0);

  // le gris couché à plat, en longs traits un peu penchés
  for (let y = -20, n = 0; y < H + 30; y += 8, n++) {
    const pts = [];
    for (let x = -30; x <= W + 30; x += 40) pts.push([x, y + x * 0.06 + Math.sin(x * 0.01 + n) * 3, 0.62 + 0.18 * Math.sin(x * 0.004 + n * 0.7)]);
    tracer(P, "crayon", pts, k(0.9));
  }

  for (let x = -10; x < 120; x += 10) { tracer(P, "crayon", [[x, -20, 0.7], [x + 30, H + 20, 0.7]], k(1)); tracer(P, "crayon", [[W - x, -20, 0.7], [W - x - 30, H + 20, 0.7]], k(1)); }

    const pts = [];

    for (let b = 0, sens = 1; b <= bandes; b++, sens = -sens) {

    const c = [0, 1, 2].map(k => Math.max(0, Math.min(255, (pap[k] * jour[k] - pap[k] * (1 - a)) / a)) | 0);
    dernierJour = `${ombrage}, linear-gradient(rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)}),rgba(${c[0]},${c[1]},${c[2]},${a.toFixed(3)}))`;
    for (const l of ELT.contenu.querySelectorAll(".lumiere")) l.style.background = dernierJour;
  };
  setInterval(regarder, 400);
  setInterval(glisser, 100);
}

// ---------- passer de la pile à la feuille, et retour ----------
let enMouvement = false;
function envol(src, depuis, vers, fini) {
  const im = document.createElement("img");
  im.className = "envol"; im.src = src;
  const pose = r => `translate(${r.x}px,${r.y}px) rotate(${r.a || 0}deg) scale(${r.w / 100},${r.h / 100})`;
  im.style.width = "100px"; im.style.height = "100px";
  im.style.transform = pose(depuis);
  document.body.appendChild(im);
  im.getBoundingClientRect();
  requestAnimationFrame(() => { im.style.transform = pose(vers); });
  let fait = false;
  const fin = () => { if (fait) return; fait = true; fini(); requestAnimationFrame(() => im.remove()); };
  im.addEventListener("transitionend", fin);
  setTimeout(fin, 520);
}
function rectCarte(el) {
  const a = +el.dataset.angle || 0, w = el.offsetWidth, h = el.offsetHeight;
  const rc = el.getBoundingClientRect();
  // la feuille est couchée : on part de ce qu'on en voit à l'écran
  if (INCLINE) return { x: rc.left, y: rc.top, w: rc.width, h: rc.height, a: 0 };
  // coin haut-gauche de la carte tournée autour de son centre
  const cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2, t = a * Math.PI / 180;
  return { x: cx - (w / 2) * Math.cos(t) + (h / 2) * Math.sin(t), y: cy - (w / 2) * Math.sin(t) - (h / 2) * Math.cos(t), w, h, a };
}
async function ouvrir(el) {
  if (enMouvement) return;
  enMouvement = true;
  const id = el.dataset.id;
  const src = el.querySelector(".vue").src;
  const depuis = rectCarte(el);
  F.G.fill(0); F.I.fill(0);
  histo.length = 0;
  tissu = new Float32Array(TS * TS);
  modifie = false;
  let rec = null;
  if (id === "nouvelle") courant = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), cree: Date.now() };
  else {
    rec = await lireDessin(id);
    courant = { id, cree: rec ? rec.cree : Date.now() };
    if (rec) { try { await chargerDans(rec, F.G, F.I, F.S); } catch (_) {} }
  }
  const vers = { x: 0, y: 0, w: rec ? rec.w / (rec.dpr || DPR) : F.limX / DPR, h: rec ? rec.h / (rec.dpr || DPR) : F.ch / DPR, a: 0 };
  envol(src, depuis, vers, () => {
    vue = "feuille";
    AMB.arreter();
    ELT.dessin.classList.remove("cache");
    ELT.pile.classList.add("cache");
    dimensionnerTout();
    composer(F, 0, 0, F.cw - 1, F.ch - 1);
    dessinerMarge();
    enMouvement = false;
  });
}
async function allerPile() {
  if (enMouvement) return;
  enMouvement = true;
  if (modifie) await sauver_(); else if (sauveEnCours) await sauveEnCours;
  const src = await new Promise(res => vignette(F.cv, F.limX, F.ch).then(b => res(URL.createObjectURL(b))));
  vue = "pile";
  ELT.pile.classList.remove("cache");
  appliquerAmbiance();
  await remplirPile(false, courant && courant.id);
  const el = courant && ELT.contenu.querySelector(`[data-id="${courant.id}"]`);
  const vers = el ? rectCarte(el) : { x: innerWidth / 2, y: innerHeight / 2, w: 1, h: 1, a: 0 };
  if (el) el.style.visibility = "hidden";
  ELT.dessin.classList.add("cache");
  envol(src, { x: 0, y: 0, w: F.limX / DPR, h: F.ch / DPR, a: 0 }, vers, () => {
    if (el) el.style.visibility = "";
    URL.revokeObjectURL(src);
    enMouvement = false;
  });
}

addEventListener("resize", dimensionnerTout);
if (window.ResizeObserver) new ResizeObserver(dimensionnerTout).observe(document.body);
dimensionnerTout();
appliquerAmbiance();
remplirPile(true);
window.__feuille = { choisir, dessinerMarge, F, M };
})();
</script>
